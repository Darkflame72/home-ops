name: Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      - requirements-docs.txt
      - .github/workflows/docs.yaml
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - requirements-docs.txt
      - .github/workflows/docs.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: zensical build --clean --strict

      # Pushes to main publish the site to Cloudflare Pages (project: home-ops-docs).
      # Pull requests only build, so a PR can't deploy.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.166.0 pages deploy site
          --project-name=home-ops-docs
          --branch=main
          --commit-hash=${{ github.sha }}
