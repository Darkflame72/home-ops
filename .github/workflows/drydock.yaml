name: drydock

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: drydock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drydock:
    name: Diff
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Run drydock
        uses: sholdee/drydock/pr-action@6a522266a40a7e64d69b42e6fc5bee1591ff923f # v0.3.4
        with:
          # renovate: datasource=github-releases depName=sholdee/drydock
          version: v0.3.5
