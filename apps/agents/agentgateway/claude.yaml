---
# Claude Code (and any Anthropic-API client) through agentgateway so every
# request is traced to Phoenix. Subscription (Claude Pro/Max) logins work as
# pass-through: no auth secret here, so the client's own
# `Authorization: Bearer <oauth token>` reaches Anthropic unchanged and
# agentgateway never stores a credential. Config follows
# agentgateway.dev .../integrations/llm/clients/claude-code (Teams/Pro setup).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
  namespace: agents
spec:
  ai:
    provider:
      anthropic: {}
  policies:
    ai:
      routes:
        "/v1/messages": Messages
        "/v1/messages/count_tokens": AnthropicTokenCount
        "*": Passthrough
---
# Dedicated hostname so this never collides with the OpenAI /v1 route (llm.yaml),
# which matches every host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claude
  namespace: agents
  labels:
    # pihole-dns builds records from every HTTPRoute hostname; this one is
    # attached to the proxy (LB 10.0.60.1, plain HTTP only), so without this
    # llm.darkflame.dev resolved there instead of to envoy-internal (TLS).
    # llm-internal below is the one that should own the DNS record.
    home-operations.com/pihole: ignore
spec:
  hostnames:
    - llm.darkflame.dev
  parentRefs:
    - name: agentgateway-proxy
      namespace: agents
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: anthropic
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# LAN entry point with TLS (same pattern as agentgateway.darkflame.dev in
# httproute.yaml), so the OAuth bearer isn't sent in cleartext on the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-internal
  namespace: agents
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - llm.darkflame.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: agentgateway-proxy
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Documented as mandatory for the Claude OAuth flow (large request bodies).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: claude-buffer
  namespace: agents
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  frontend:
    http:
      maxBufferSize: 10485760
