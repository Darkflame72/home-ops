---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-llm-key
  namespace: agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: agentgateway-llm-key
  data:
    - secretKey: Authorization
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: /agentgateway/openai-api-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mcp-auth-token
  namespace: agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-mcp-auth-token
  data:
    - secretKey: Authorization
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: /argocd/mcp-auth-token
