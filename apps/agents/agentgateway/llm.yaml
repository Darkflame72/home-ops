---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-backend
  namespace: agents
spec:
  ai:
    provider:
      # No model override: pinning one here silently rewrote every client's
      # model (e.g. goose's gpt-6-luna) to it. Clients choose their own model.
      openai: {}
  policies:
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/responses": Responses
        "*": Passthrough
    auth:
      secretRef:
        name: agentgateway-llm-key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agents
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agents
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: llm-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# OpenAI-format clients (goose, anything honouring OPENAI_BASE_URL) via the same
# TLS hostname as the Claude route. The gateway holds the OpenAI key
# (agentgateway-llm-key), so clients only need a placeholder key. More specific
# paths than the claude route's "/", so they win on this host. New name rather
# than editing the "llm" route: rule edits to existing HTTPRoutes don't apply
# via Argo here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openai
  namespace: agents
  labels:
    home-operations.com/pihole: ignore
spec:
  hostnames:
    - llm.darkflame.dev
  parentRefs:
    - name: agentgateway-proxy
      namespace: agents
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
        - path:
            type: PathPrefix
            value: /v1/responses
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: llm-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
