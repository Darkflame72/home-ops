---
# OpenAI-format clients (goose, anything honouring OPENAI_BASE_URL) on the same
# TLS hostname as the Claude route. The gateway holds the OpenAI key
# (agentgateway-llm-key), so clients only need a placeholder key, and every
# call is traced to Phoenix.
#
# Separate from llm-backend (llm.yaml, which pins model: gpt-5-mini for kagent)
# because pinning silently rewrote every client's model, and an in-place edit
# of that backend fails under server-side apply (openai: {} becomes null).
# Fresh objects are created whole, so this is a new backend + route instead.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai-gateway
  namespace: agents
spec:
  ai:
    provider:
      openai: {}
  policies:
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/responses": Responses
        "*": Passthrough
    auth:
      secretRef:
        name: agentgateway-llm-key
---
# More specific paths than the claude route's "/", so they win on this host.
# New route name: rule edits to existing HTTPRoutes don't apply via Argo here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-openai
  namespace: agents
  labels:
    home-operations.com/pihole: ignore
spec:
  hostnames:
    - llm.darkflame.dev
  parentRefs:
    - name: agentgateway-proxy
      namespace: agents
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
        - path:
            type: PathPrefix
            value: /v1/responses
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: openai-gateway
          group: agentgateway.dev
          kind: AgentgatewayBackend
