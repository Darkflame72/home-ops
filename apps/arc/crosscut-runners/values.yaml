githubConfigUrl: https://github.com/crosscut-ai
githubConfigSecret: arc-github-app
minRunners: 0
maxRunners: 10
containerMode:
  type: dind
template:
  spec:
    containers:
      - name: runner
        # renovate: datasource=docker depName=ghcr.io/actions/actions-runner
        image: ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
# The scale-set listener pod is generated by the controller, so its resources are set here.
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
# ArgoCD renders without cluster access, so the chart's controller auto-discovery
# (a `lookup`) can't work; point at the controller's service account explicitly.
controllerServiceAccount:
  namespace: arc-systems
  name: gha-runner-scale-set-controller-gha-rs-controller
