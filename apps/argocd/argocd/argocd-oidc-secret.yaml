---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Merges the Authentik client secret into argocd-secret. argocd-cm references it as
# $oidc.authentik.clientSecret. The value is the same Infisical secret the Authentik
# blueprint reads (ARGOCD_CLIENT_SECRET in authentik-blueprint-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: /argocd/oauth2-client-secret
