---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gotosocial-postgres
  namespace: comms
spec:
  instances: 3
  # Read-only monitoring login for the OTel postgresql receiver (pg_monitor).
  # Password comes from the pg-monitor-secret ClusterExternalSecret.
  managed:
    roles:
      - name: otel_monitor
        ensure: present
        login: true
        inRoles:
          - pg_monitor
          - pg_read_all_data
        passwordSecret:
          name: pg-monitor-secret
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised

  # comms is enrolled in the Istio ambient mesh, which breaks CNPG's own TLS
  # + streaming-replication protocol on 5432 (see apps/default/nextcloud/
  # cluster.yaml for the incident). Opt out of ambient capture.
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: none

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  resources:
    requests:
      memory: "896Mi"
      cpu: "100m"
    limits:
      memory: "4Gi"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gotosocial-postgres
