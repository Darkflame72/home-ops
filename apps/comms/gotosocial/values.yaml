# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
controllers:
  gotosocial:
    containers:
      app:
        image:
          repository: "docker.io/superseriousbusiness/gotosocial"
          tag: "0.22.3@sha256:3f36dcf14a4f2e5562122e4783117c48a219d67988f841181b5c2ecaa65d5581"
        env:
          TZ: "Pacific/Auckland"
          GTS_HOST: &host social.darkflame.dev
          GTS_ACCOUNT_DOMAIN: darkflame.dev
          GTS_LANDING_PAGE_USER: "leon"
          GTS_ACCOUNTS_REGISTRATION_OPEN: "false"
          GTS_APPLICATION_NAME: "My corner of the fediverse"
          GTS_PROTOCOL: "https" # not HTTP server listen mode, but used for generating URLs etc
          GTS_PORT: "8080"
          GTS_METRICS_ENABLED: "true"
          # Metrics are served on their own listener (default 9464), not the main port, so expose it for the ServiceMonitor.
          OTEL_METRICS_PRODUCERS: prometheus
          OTEL_METRICS_EXPORTER: prometheus
          OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
          OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
          GTS_TRACING_ENABLED: "true"
          OTEL_TRACES_EXPORTER: "otlp"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-kube-stack-daemon-collector.observability.svc.cluster.local:4318"
          GTS_OIDC_ENABLED: "true"
          GTS_OIDC_IDP_NAME: "Authentik"
          GTS_OIDC_SKIP_VERIFICATION: "false"
          GTS_OIDC_ISSUER: https://auth.darkflame.dev/application/o/gotosocial/
          GTS_TRUSTED_PROXIES: "10.42.0.0/16"
          GTS_DB_TYPE: postgres
          GTS_DB_POSTGRES_CONNECTION_STRING:
            valueFrom:
              secretKeyRef:
                name: gotosocial-postgres-app
                key: uri
        envFrom:
          - secretRef:
              name: gotosocial-secret
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 512Mi
          limits:
            memory: 2Gi
service:
  app:
    ports:
      http:
        port: &port 8080
      metrics:
        port: 9464
serviceMonitor:
  app:
    endpoints:
      - port: metrics
route:
  app:
    hostnames:
      - *host
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
persistence:
  storage:
    existingClaim: gotosocial
    globalMounts:
      - path: /gotosocial/storage
  tmp:
    type: emptyDir
    medium: Memory
    globalMounts:
      - subPath: tmp
        path: /tmp # ffmpeg WASM stuff
defaultPodOptions:
  annotations:
    instrumentation.opentelemetry.io/inject-sdk: "observability/opentelemetry-kube-stack"
  securityContext:
    runAsNonRoot: true
    runAsUser: &uid 568
    runAsGroup: *uid
    fsGroup: *uid
    fsGroupChangePolicy: Always
    seccompProfile: { type: "RuntimeDefault" }
