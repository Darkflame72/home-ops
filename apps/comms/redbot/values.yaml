# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
controllers:
  redbot:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/phasecorex/red-discordbot
          tag: extra-audio@sha256:07a97b414b83acd993d0332a6e7dbdcf9c4cb25d2f316c2967b1946d6c0728b2
        env:
          PREFIX: "?"
          TZ: Pacific/Auckland
        envFrom:
          - secretRef:
              name: redbot-secret
        resources:
          requests:
            cpu: 10m
            memory: 448Mi
          limits:
            memory: 512Mi
defaultPodOptions:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
persistence:
  config:
    existingClaim: redbot
    globalMounts:
      - path: /data
