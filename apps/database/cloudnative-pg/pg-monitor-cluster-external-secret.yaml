---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clusterexternalsecret_v1.json
# Password for the read-only `otel_monitor` role (pg_monitor) that every CNPG cluster
# creates through spec.managed.roles. The secret must sit in each cluster's namespace
# (CNPG reads passwordSecret locally), and the OTel collector reads it from observability.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: pg-monitor-secret
spec:
  externalSecretName: pg-monitor-secret
  # Every namespace, so a new CNPG cluster in any namespace gets the password
  # without an edit here. The secret only holds the password of a pg_monitor role.
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: Exists
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: pg-monitor-secret
      template:
        metadata:
          labels:
            # CNPG reloads a role's password when a secret with this label changes.
            cnpg.io/reload: "true"
        data:
          username: otel_monitor
          password: "{{ .password }}"
    data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: /cloudnative-pg/otel-monitor-password
