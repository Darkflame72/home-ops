---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
controllers:
  excalidraw:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/alam00000/bentopdf
          tag: 2.8.12@sha256:beec9d0e0ccb96e59dbff6d26bd7c954c89c880a8c0be5c85004ecc707736516
        securityContext:
          # Kubelet can't verify non-root for images with a non-numeric
          # USER (nginx here) — needs an explicit numeric UID or it
          # refuses to start with CreateContainerConfigError.
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 5m
            memory: 10Mi
          limits:
            memory: 50Mi
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    ports:
      http:
        port: &port 8080
route:
  app:
    hostnames: ["pdf.darkflame.dev"]
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
