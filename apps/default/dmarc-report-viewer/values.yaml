---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
controllers:
  dmarc-report-viewer:
    containers:
      app:
        image:
          repository: ghcr.io/cry-inc/dmarc-report-viewer
          tag: 2.6.2@sha256:2e34b1a6e530bd953c29458d1fa00840830ecc7f727aa0ec191757077f11b829
        env:
          IMAP_HOST: mail.darkflame.dev
          IMAP_USER: mailauth-reports@darkflame.dev
          IMAP_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: dmarc-report-viewer-secret
                key: IMAP_PASSWORD
          HTTP_SERVER_PORT: &port 8080
          HTTP_SERVER_USER:
            valueFrom:
              secretKeyRef:
                name: dmarc-report-viewer-secret
                key: HTTP_SERVER_USER
          HTTP_SERVER_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: dmarc-report-viewer-secret
                key: HTTP_SERVER_PASSWORD
        probes:
          # /health is the one unauthenticated endpoint the app exposes -
          # everything else is behind HTTP basic auth.
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    annotations:
      # Basic-auth gated on every path, so the auto-discovered check (which
      # expects 200) would always report down. Replaced with a manual
      # gatus config.yaml entry expecting 401 instead.
      gatus.home-operations.com/enabled: "false"
    hostnames:
      - dmarc.darkflame.dev
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
