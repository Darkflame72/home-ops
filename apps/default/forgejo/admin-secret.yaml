# The forgejo chart draws the admin password from a random value on every render
# when no existing secret is set, so each sync rotated it. The password lives in
# Infisical instead (prod, /forgejo/admin-password), stored base64-encoded as it
# is in the cluster, hence b64dec. The username matches gitea.admin.username.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: forgejo-admin-keys
    template:
      data:
        username: gitea_admin
        password: "{{ .adminPassword | b64dec }}"
  data:
  - secretKey: adminPassword
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /forgejo/admin-password
