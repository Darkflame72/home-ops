# The harbor chart draws these from random values on every render. Keeping them
# in Infisical means each sync reproduces the same values, so nothing rotates.
# Values are stored base64-encoded, as they are in the cluster, hence b64dec.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: harbor-core-keys
    template:
      data:
        secret: "{{ .coreSecret | b64dec }}"
        CSRF_KEY: "{{ .csrfKey | b64dec }}"
  data:
  - secretKey: coreSecret
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/core-secret
  - secretKey: csrfKey
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/csrf-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-token-ca
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: harbor-token-ca
    template:
      data:
        tls.key: "{{ .tokenKey | b64dec }}"
        tls.crt: "{{ .tokenCrt | b64dec }}"
  data:
  - secretKey: tokenKey
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/token-tls-key
  - secretKey: tokenCrt
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/token-tls-crt
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-jobservice-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: harbor-jobservice-keys
    template:
      data:
        JOBSERVICE_SECRET: "{{ .jobserviceSecret | b64dec }}"
  data:
  - secretKey: jobserviceSecret
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/jobservice-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: harbor-registry-keys
    template:
      data:
        REGISTRY_HTTP_SECRET: "{{ .registryHttpSecret | b64dec }}"
  data:
  - secretKey: registryHttpSecret
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/registry-http-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: harbor-registry-credentials
    template:
      data:
        REGISTRY_PASSWD: "{{ .registryPassword | b64dec }}"
        REGISTRY_HTPASSWD: "{{ .registryHtpasswd | b64dec }}"
  data:
  - secretKey: registryPassword
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/registry-password
  - secretKey: registryHtpasswd
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/registry-htpasswd
