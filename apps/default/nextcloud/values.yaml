image:
  # renovate: datasource=docker depName=nextcloud
  tag: 35.0.2-apache@sha256:e0b1a2af52c82c07b7a0e8e59878bd8769e704447734d5d238a836982f51b9c8


phpClientHttpsFix:
  enabled: true

httpRoute:
  enabled: true
  hostnames:
    - cloud.darkflame.dev
  parentRefs:
    - name: envoy-external
      namespace: network
  annotations:
    # The gatus-sidecar auto-discovers the first rule on the route, which is
    # the /.well-known/carddav redirect to WebDAV. Force it back to a
    # bare-host probe so it checks the main page (redirects to /login, 200)
    # instead.
    gatus.home-operations.com/endpoint: |-
      path: ""

service:
  port: 80

nextcloud:
  host: cloud.darkflame.dev
  existingSecret:
    enabled: true
    secretName: nextcloud-secret
  extraEnv:
    - name: TRUSTED_PROXIES
      value: "10.42.0.0/16 10.43.0.0/16"
    - name: OVERWRITECLIURL
      value: "https://cloud.darkflame.dev"
    - name: OVERWRITEHOST
      value: "cloud.darkflame.dev"
  configs:
    hide-login-form.config.php: |-
      <?php
      $CONFIG = array (
        'hide_login_form' => true,
      );
    maintenance-window.config.php: |-
      <?php
      $CONFIG = array (
        'maintenance_window_start' => 2,
      );
    allow-local-remote-servers.config.php: |-
      <?php
      $CONFIG = array (
        // auth.darkflame.dev resolves to an internal (private) IP via
        // pi-hole split-horizon DNS; without this, Nextcloud's SSRF guard
        // blocks user_oidc's outgoing discovery/token requests to Authentik.
        'allow_local_remote_servers' => true,
      );

startupProbe:
  enabled: true
  failureThreshold: 60

internalDatabase:
  enabled: false

externalDatabase:
  type: postgresql
  existingSecret:
    secretName: nextcloud-postgres-app
    usernameKey: user
    passwordKey: password
    hostKey: host
    databaseKey: dbname

externalRedis:
  enabled: true
  host: nextcloud-redis.default.svc.cluster.local

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nextcloud
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - app
            topologyKey: kubernetes.io/hostname
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

persistence:
  enabled: true
  existingClaim: nextcloud-app
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-nfs

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

prometheus:
  serviceMonitor:
    enabled: true
