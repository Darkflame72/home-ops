# Kubernetes audit-log detection. A separate, unprivileged Falco release: no driver, no
# collectors, one replica. Audit events arrive from Fluent Bit over TLS (see apps/falco/fluent-bit).
# Base layout follows the chart's values-k8saudit.yaml.
fullnameOverride: falco-k8saudit

driver:
  enabled: false

collectors:
  enabled: false

controller:
  kind: deployment
  deployment:
    replicas: 1

# Pods run as non-root with no host access. The audit listener needs nothing from the node.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Server certificate from cert-manager (apps/falco/falco-k8saudit/pki.yaml).
# The secret mounts at /etc/falco/certs; the combined key+cert file is used below.
certs:
  existingSecret: falco-k8saudit-tls

falcoctl:
  artifact:
    install:
      # Plugin and rules are installed by the init container at pinned versions.
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      # Signature verification writes a Sigstore cache under $HOME. The root filesystem is not
      # writable for this non-root user, so point HOME at the emptyDir that is already mounted.
      env:
        - name: HOME
          value: /artifactstate
    follow:
      # Disabled: executable plugins are not updated at runtime. Bumps go through a PR.
      enabled: false
  config:
    artifact:
      install:
        resolveDeps: true
        # Pinned to the chart's tested versions. Bump in a PR after reading release notes.
        refs: [k8saudit-rules:0.16, k8saudit:0.16]

services:
  - name: webhook
    type: ClusterIP
    ports:
      - port: 9765
        protocol: TCP

# Routine, known API-server activity. Each entry pins the principal and the namespace, so anything
# else (other principals, other namespaces, interactive users) still alerts.
customRules:
  customized-k8s-audit-rules.yaml: |-
    # Talos manages the cluster as talos:admin. This is system activity, not an interactive user.
    - list: allowed_k8s_users
      override:
        items: append
      items: ["talos:admin"]
    - macro: user_known_portforward_activities
      condition: (ka.user.name = "system:serviceaccount:observability:kiali" and ka.target.namespace = "istio-system")
    # Kopia backups read application secrets in the namespaces they back up.
    - macro: user_known_secret_get_activities
      condition: >
        (ka.user.name = "system:serviceaccount:observability:grafana-operator" and ka.target.namespace = "observability") or
        (ka.user.name = "system:serviceaccount:policy:kyverno-admission-controller" and ka.target.namespace = "policy") or
        (ka.user.name = "system:serviceaccount:external-secrets:external-secrets-cert-controller" and ka.target.namespace = "external-secrets") or
        (ka.user.name = "system:serviceaccount:argocd:argocd-application-controller" and ka.target.namespace = "default") or
        (ka.user.name = "system:serviceaccount:rook-ceph:rook-ceph-rbd-csi-ceph-com-nodeplugin-sa" and ka.target.namespace = "rook-ceph") or
        (ka.user.name = "system:serviceaccount:renovate:renovate-operator-renovate-operator" and ka.target.namespace = "renovate") or
        (ka.user.name = "system:serviceaccount:rook-ceph:rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa" and ka.target.namespace = "rook-ceph") or
        (ka.user.name = "system:serviceaccount:default:nextcloud-postgres" and ka.target.namespace = "default") or
        (ka.user.name = "system:serviceaccount:kopiur-system:kopiur" and
          ka.target.namespace in ("kopiur-system", "comms", "default", "opencloud", "media", "games", "observability", "security", "renovate")) or
        (ka.user.name = "system:serviceaccount:external-secrets:external-secrets" and
          ka.target.namespace in ("external-secrets", "default", "media", "security", "observability", "agents", "argocd", "comms", "renovate", "network", "games", "opencloud", "cert-manager", "rook-ceph", "kube-system", "kopiur-system", "forgejo-runners", "database", "arc-runners", "crosscut-dev")) or
        (ka.user.name = "system:serviceaccount:observability:policy-reporter-ui" and ka.target.namespace = "observability") or
        (ka.user.name = "system:serviceaccount:network:envoy-gateway-gateway-helm-certgen" and ka.target.namespace = "network") or
        (ka.user.name = "system:serviceaccount:network:envoy-gateway" and ka.target.namespace = "network") or
        (ka.user.name = "system:serviceaccount:security:authentik-postgres" and ka.target.namespace = "security") or
        (ka.user.name = "system:serviceaccount:default:harbor-postgres" and ka.target.namespace = "default") or
        (ka.user.name = "system:serviceaccount:argocd:argocd-application-controller" and ka.target.namespace = "argocd") or
        (ka.user.name = "system:serviceaccount:argocd:argocd-redis-secret-init" and ka.target.namespace = "argocd") or
        (ka.user.name = "system:serviceaccount:policy:kyverno-cleanup-controller" and ka.target.namespace = "policy") or
        (ka.user.name = "system:serviceaccount:cert-manager:cert-manager-cainjector" and ka.target.namespace in ("cert-manager", "observability")) or
        (ka.user.name = "system:serviceaccount:observability:gatus-postgres" and ka.target.namespace = "observability") or
        (ka.user.name = "system:serviceaccount:istio-system:istiod" and ka.target.namespace = "istio-system") or
        (ka.user.name = "system:serviceaccount:database:cloudnative-pg" and ka.target.namespace = "database") or
        (ka.user.name = "system:serviceaccount:arc-systems:gha-runner-scale-set-controller-gha-rs-controller" and ka.target.namespace in ("arc-systems", "arc-runners")) or
        (ka.user.name = "system:serviceaccount:rook-ceph:rook-ceph-system" and ka.target.namespace = "rook-ceph") or
        (ka.user.name = "system:serviceaccount:cert-manager:cert-manager" and ka.target.namespace = "cert-manager") or
        (ka.user.name startswith "system:node:" and ka.target.namespace = "rook-ceph" and ka.target.name = "rook-csi-rbd-node") or
        (ka.user.name = "system:serviceaccount:media:immich-v2" and ka.target.namespace = "media") or
        (ka.user.name = "system:serviceaccount:default:miniflux-postgres" and ka.target.namespace = "default") or
        (ka.user.name = "system:serviceaccount:default:forgejo-postgres" and ka.target.namespace = "default") or
        (ka.user.name = "system:serviceaccount:comms:gotosocial-postgres" and ka.target.namespace = "comms") or
        (ka.user.name = "system:serviceaccount:security:vaultwarden-postgres" and ka.target.namespace = "security") or
        (ka.user.name = "system:serviceaccount:observability:phoenix-postgres" and ka.target.namespace = "observability") or
        (ka.user.name = "system:serviceaccount:agents:agentgateway" and ka.target.namespace = "agents" and ka.target.name = "agentgateway-proxy-session-key") or
        ka.user.name = "talos:admin"
    # Helm charts create their own ServiceAccounts, and the kubelet identity performs those creations.
    - macro: user_known_node_serviceaccount_creation
      condition: (ka.user.name startswith "system:node:")
    - rule: Service Account Created in Kube Namespace
      override:
        condition: append
      condition: and not user_known_node_serviceaccount_creation
    - rule: K8s Serviceaccount Created
      override:
        condition: append
      condition: and not user_known_node_serviceaccount_creation
    # The kube-apiserver static pod is restarted by the node identity when its config changes.
    - macro: user_known_apiserver_hostnetwork_pods
      condition: (ka.user.name startswith "system:node:" and ka.req.pod.containers.image.repository in ("registry.k8s.io/kube-apiserver"))
    - rule: Create HostNetwork Pod
      override:
        condition: append
      condition: and not user_known_apiserver_hostnetwork_pods
    # The descheduler CronJob runs in kube-system.
    - macro: user_known_descheduler_pods
      condition: (ka.user.name = "system:serviceaccount:kube-system:job-controller" and ka.req.pod.containers.image.repository in ("registry.k8s.io/descheduler/descheduler"))
    - rule: Pod Created in Kube Namespace
      override:
        condition: append
      condition: and not user_known_descheduler_pods
    # The Cilium DaemonSet and its operator create hostNetwork pods and mount host paths on every rollout.
    - macro: user_known_cilium_pods
      condition: >
        ((ka.user.name = "system:serviceaccount:kube-system:daemon-set-controller" or
          ka.user.name = "system:serviceaccount:kube-system:replicaset-controller") and ka.target.namespace = "kube-system" and
          ka.req.pod.containers.image.repository in ("quay.io/cilium/cilium", "quay.io/cilium/cilium-envoy", "quay.io/cilium/operator-generic"))
    # The etcd defragmentation CronJob runs with host networking to reach the local etcd (reviewed 2026-10-25).
    - macro: user_known_etcd_defrag_jobs
      condition: (ka.user.name = "system:serviceaccount:kube-system:job-controller" and ka.target.namespace = "kube-system" and ka.req.pod.containers.image.repository in ("ghcr.io/ahrtr/etcd-defrag"))
    # Rook-Ceph daemons run with host networking by design. The ReplicaSet controller recreates them on node restarts (reviewed 2026-10-25).
    - macro: user_known_rook_ceph_hostnetwork
      condition: (ka.user.name = "system:serviceaccount:kube-system:replicaset-controller" and ka.target.namespace = "rook-ceph" and ka.req.pod.containers.image.repository in ("quay.io/ceph/ceph", "ghcr.io/rook/ceph"))
    - rule: Create HostNetwork Pod
      override:
        condition: append
      condition: and not user_known_cilium_pods and not user_known_etcd_defrag_jobs and not user_known_rook_ceph_hostnetwork
    # The OTel daemon collector mounts host log and kubelet paths by design. Scoped to the DaemonSet
    # controller, observability and the collector image (reviewed 2026-10-24).
    - macro: user_known_otel_daemon_collector
      condition: (ka.user.name = "system:serviceaccount:kube-system:daemon-set-controller" and ka.target.namespace = "observability" and ka.req.pod.containers.image.repository in ("otel/opentelemetry-collector-contrib"))
    - rule: Create Sensitive Mount Pod
      override:
        condition: append
      condition: and not user_known_cilium_pods and not user_known_otel_daemon_collector
    # Rook runs the OSD prepare jobs with the Ceph image, which needs privileged access to the disks.
    - macro: user_known_rook_ceph_jobs
      condition: (ka.user.name = "system:serviceaccount:kube-system:job-controller" and ka.target.namespace = "rook-ceph" and ka.req.pod.containers.image.repository in ("quay.io/ceph/ceph"))
    - rule: Create Privileged Pod
      override:
        condition: append
      condition: and not user_known_rook_ceph_jobs
    # The OpenEBS local-PV provisioner starts privileged linux-utils helper pods for volume operations.
    - macro: user_known_openebs_privileged_helpers
      condition: (ka.user.name = "system:serviceaccount:openebs-system:openebs-localpv-provisioner" and ka.req.pod.containers.image.repository in ("quay.io/openebs/linux-utils"))
    - rule: Create Privileged Pod
      override:
        condition: append
      condition: and not user_known_openebs_privileged_helpers
    # The etcd backup CronJob runs the talos-backup image in kube-system (reviewed 2026-10-23).
    - macro: user_known_talos_backup_pods
      condition: (ka.user.name = "system:serviceaccount:kube-system:job-controller" and ka.req.pod.containers.image.repository in ("ghcr.io/siderolabs/talos-backup"))
    - rule: Pod Created in Kube Namespace
      override:
        condition: append
      condition: and not user_known_talos_backup_pods
    # kube-controller-manager creates ServiceAccounts for its own controllers.
    - macro: user_known_controller_manager_serviceaccounts
      condition: (ka.user.name = "system:kube-controller-manager")
    - rule: Service Account Created in Kube Namespace
      override:
        condition: append
      condition: and not user_known_controller_manager_serviceaccounts
    - rule: K8s Secret Get Successfully
      override:
        condition: append
      condition: and not user_known_secret_get_activities
    - rule: K8s Secret Get Unsuccessfully Tried
      override:
        condition: append
      condition: and not user_known_secret_get_activities

falco:
  json_output: true
  json_include_output_property: true
  # Off: the k8saudit plugin reads audit events only, so no host /proc mount is needed.
  plugins_hostinfo: false
  rules_files:
    - /etc/falco/k8s_audit_rules.yaml
    - /etc/falco/rules.d
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config:
        # maxEventBytes bounds the size of a single audit event.
        maxEventBytes: 1048576
        # Combined key+cert PEM from cert-manager's CombinedPEM output (key is tls-combined.pem).
        sslCertificate: /etc/falco/certs/tls-combined.pem
      open_params: "https://:9765/k8s-audit"
    - name: json
      library_path: libjson.so
      init_config: ""
  load_plugins: [k8saudit, json]

  # Alerts go to the shared Falcosidekick, which already routes to Loki and Alertmanager.
  http_output:
    enabled: true
    url: "http://falco-falcosidekick.falco.svc.cluster.local:2801/"

falcosidekick:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

metrics:
  enabled: true

serviceMonitor:
  create: true
