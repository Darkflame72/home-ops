# Runtime threat detection on every node. Events go to Loki (queryable) and to
# Mimir's Alertmanager (existing Discord routes in apps/observability/mimir/values.yaml).
driver:
  # Talos is immutable with no kernel headers, so no kernel module build or driver loader.
  kind: modern_ebpf
  loader:
    enabled: false


customRules:
  customized-local-rules.yaml: |-
    # Expected node-level behaviour, not alerted on (reviewed 2026-10-21).
    # ARC runner jobs execute test binaries they just compiled in their workspace (crosscut cargo-nextest), reviewed 2026-10-24.
    # Containerd runs these CNI plugins when pods start.
    # Forgejo runner jobs run in containers started by the dind daemon, which Falco cannot attribute to a
    # Kubernetes namespace or container name. Scoped by job workspace and toolcache binaries instead (reviewed 2026-10-22).
    # Forgejo runner dind jobs often have no namespace metadata, so the namespace is not tested. Scoped by root,
    # the job workspace and the toolcache/pnpm binaries (reviewed 2026-10-25). Kept outside the condition block.
    # ARC runners build Rust crates with the toolchain in /home/runner/.rustup, link with the system GCC driver, and
    # run rustup-init from /tmp. Scoped to the runner container and uid 1001 (reviewed 2026-10-25).
    # GitHub (ARC) and Forgejo runner containers run CI-built binaries by design. Their binary execution is not alerted
    # on, scoped to the runner container and uid, and the Forgejo dind root jobs in /workspace (reviewed 2026-10-25).
    # uv builds sdists from its cache in a root CI container on the dind runner (reviewed 2026-10-31).
    - macro: known_drop_and_execute_activities
      condition: >
        (proc.pname = containerd and user.uid = 0 and proc.exepath = "/opt/cni/bin/cilium-cni" and proc.cmdline = "cilium-cni") or
        (proc.pname = containerd and user.uid = 0 and proc.exepath = "/opt/cni/bin/istio-cni" and proc.cmdline = "istio-cni") or
        (k8s.ns.name = "kube-system" and container.name in ("mount-cgroup", "apply-sysctl-overwrites") and user.uid = 0 and
          proc.pname = bash and proc.exepath in ("/opt/cni/bin/cilium-mount", "/opt/cni/bin/cilium-sysctlfix")) or
        (k8s.ns.name = "renovate" and container.name = "renovate" and proc.exepath startswith "/opt/containerbase/tools/") or
        (container.id != host and user.uid = 0 and proc.cwd startswith "/workspace/") or
        (k8s.ns.name = "arc-runners" and container.name = "runner" and user.uid = 1001) or
        (container.id != host and user.uid = 0 and proc.exepath startswith "/root/.local/share/uv/python/" and
          proc.cwd startswith "/root/.cache/uv/sdists-v")
    # Forgejo dind CI jobs run a pg_isready health check as root. Its perl helper reads /etc/shadow through NSS.
    # Scoped to that exact process and file (reviewed 2026-10-31).
    - macro: user_known_read_sensitive_files_activities
      condition: (proc.name = pg_isready and proc.exepath = "/usr/bin/perl" and fd.name = "/etc/shadow" and container.id != host and user.uid = 0)
    # buildkit and containerd append to dpkg.log while apt installs packages in image build snapshots, or while
    # containerd (dind pulls) or buildkitd (buildx image unpacks) mount an image into a tmpmount (reviewed 2026-10-31).
    - macro: allowed_clear_log_files
      condition: >
        (proc.name in (buildkitd, containerd) and fd.name endswith "/var/log/dpkg.log" and
          (fd.name startswith "/var/lib/buildkit/runc-overlayfs/snapshots/" or
           fd.name startswith "/var/lib/docker/containerd/daemon/io.containerd.snapshotter.v1.overlayfs/snapshots/" or
           fd.name startswith "/var/lib/docker/containerd/daemon/tmpmounts/" or
           (proc.name = buildkitd and fd.name startswith "/tmp/containerd-mount")))
    # Cilium runs its packet socket from the cilium-agent container in kube-system (reviewed 2026-10-23).
    - rule: Packet socket created in container
      override:
        condition: append
      condition: and not (k8s.ns.name = "kube-system" and container.name = "cilium-agent" and proc.exepath = "/usr/bin/cilium-agent" and user.uid = 0)
    # buildx's multi-platform check runs a QEMU probe binary it writes to /tmp under buildkitd (reviewed 2026-10-31).
    # Scoped to that parent and path. Dind jobs carry no k8s metadata, so the namespace can't be tested here.
    - rule: Drop and execute new binary in container
      override:
        condition: append
      condition: and not (proc.pname = buildkitd and proc.name = check and proc.exepath startswith "/tmp/qemu-check")
    # CI jobs run setup-python and pip-upgrade from the tool cache as root in a job container (reviewed 2026-10-31).
    # Scoped to containers other than the host, root, and the tool cache's Python directory.
    - rule: Drop and execute new binary in container
      override:
        condition: append
      condition: and not (container.id != host and user.uid = 0 and proc.exepath startswith "/opt/hostedtoolcache/Python/" and proc.cwd startswith "/opt/hostedtoolcache/Python/")
    # Expected dind runner socket, reviewed 2026-10-22. Only the forgejo-runners dind dockerd is exempt.
    - rule: Packet socket created in container
      override:
        condition: append
      condition: and not (k8s.ns.name = "forgejo-runners" and container.name = "dind" and proc.exepath = "/usr/local/bin/dockerd" and user.uid = 0)
    # Each entry pins namespace, pod, container, binary, uid and command line,
    # so only that exact process in that exact workload is allowed to call the API server.
    # CloudNativePG runs wal-restore through dash in its own postgres containers (reviewed 2026-10-25).
    - rule: Run shell untrusted
      override:
        condition: append
      condition: and not (container.image.repository = "ghcr.io/cloudnative-pg/postgresql" and proc.exepath in ("/bin/dash", "/usr/bin/dash") and user.name = "postgres" and proc.cmdline startswith "sh -c /controller/manager wal-restore")
    # Nextcloud's image probes for office suites at startup with command -v (reviewed 2026-11-01).
    - rule: Run shell untrusted
      override:
        condition: append
      condition: and not (k8s.ns.name = "default" and container.name = "nextcloud" and proc.name = "sh" and proc.cmdline startswith "sh -c -- command -v -- " and (proc.cmdline contains "libreoffice" or proc.cmdline contains "openoffice"))
    # Scheduled sync job lists PrometheusRules on every run (reviewed 2026-11-01).
    - macro: user_known_contact_k8s_api_server_activities
      condition: >
        (k8s.ns.name = "crosscut-dev" and proc.exepath = "/usr/local/bin/crosscut-sync" and proc.name = "tokio-rt-worker") or
        (k8s.ns.name = "argo-rollouts" and proc.exepath = "/bin/rollouts-controller") or
        (k8s.ns.name = "policy" and proc.exepath = "/ko-app/kyverno-init") or
        (k8s.ns.name = "external-secrets" and proc.exepath = "/usr/bin/external-secrets") or
        (k8s.ns.name = "cert-manager" and proc.exepath = "/app/cmd/controller/controller") or
        (k8s.ns.name = "network" and proc.exepath = "/ko-app/external-dns") or
        (k8s.ns.name = "observability" and proc.exepath = "/main" and container.image.repository = "ghcr.io/open-telemetry/opentelemetry-operator/target-allocator") or
        (k8s.ns.name = "policy" and proc.exepath = "/ko-app/cleanup-controller") or
        (k8s.ns.name = "argocd" and proc.exepath = "/shared/argocd-dex") or
        (k8s.ns.name = "rook-ceph" and proc.exepath = "/rook/copied-binaries/rook") or
        (k8s.ns.name = "games" and proc.exepath = "/mc-router") or
        (k8s.ns.name = "network" and proc.exepath = "/usr/local/bin/envoy-gateway") or
        (container.image.repository = "ghcr.io/cloudnative-pg/postgresql" and proc.exepath = "/controller/manager") or
        (k8s.ns.name = "crosscut-dev" and proc.exepath = "/usr/local/bin/crosscut-sync" and proc.cmdline startswith "crosscut-sync serve") or
        (k8s.ns.name = "observability" and container.name = "sync" and proc.name = "kubectl"
          and proc.cmdline startswith "kubectl get prometheusrules -A") or
        (k8s.ns.name = "observability" and proc.exepath = "/app/policyreporter" and proc.cmdline startswith "policyreporter run") or
        (k8s.ns.name = "observability" and proc.exepath = "/ko-app/policy-reporter-ui" and proc.cmdline startswith "policy-reporter run --config") or
        (k8s.ns.name = "cert-manager" and proc.exepath = "/app/cmd/webhook/webhook" and proc.cmdline startswith "webhook --v=2") or
        (k8s.ns.name = "observability" and proc.exepath = "/manager" and proc.cmdline startswith "manager --metrics-addr=") or
        (k8s.ns.name = "arc-systems" and proc.exepath = "/ghalistener" and proc.cmdline = "ghalistener") or
        (k8s.ns.name = "agents" and k8s.pod.name startswith "agentgateway-" and container.name = "controller"
          and proc.exepath = "/usr/local/bin/agentgateway" and user.uid = 10101 and proc.cmdline = "agentgateway") or
        (k8s.ns.name = "argocd" and k8s.pod.name startswith "argocd-applicationset-controller-" and container.name = "applicationset-controller"
          and proc.exepath = "/usr/local/bin/argocd" and user.uid = 999 and proc.cmdline startswith "argocd-applicat") or
        (k8s.ns.name = "renovate" and k8s.pod.name startswith "renovate-operator-renovate-operator-" and container.name = "renovate-operator"
          and proc.exepath = "/app/renovate-operator" and user.uid = 1000 and proc.cmdline startswith "renovate-operat") or
        (k8s.ns.name = "external-secrets" and k8s.pod.name startswith "external-secrets-cert-controller-" and container.name = "cert-controller"
          and proc.exepath = "/usr/bin/external-secrets" and user.uid = 1000 and proc.cmdline startswith "external-secret certcontroller") or
        (k8s.ns.name = "observability" and k8s.pod.name startswith "kiali-" and container.name = "kiali"
          and proc.exepath = "/opt/kiali/kiali" and user.uid = 1000 and proc.cmdline startswith "kiali -config") or
        (k8s.ns.name = "argocd" and k8s.pod.name startswith "argocd-application-controller-" and container.name = "application-controller"
          and proc.exepath = "/usr/local/bin/argocd" and user.uid = 999 and proc.cmdline startswith "argocd-applicat") or
        (k8s.ns.name = "observability" and k8s.pod.name startswith "opentelemetry-kube-stack-daemon-collector-" and container.name = "otc-container"
          and proc.exepath = "/otelcol-contrib" and user.uid = 10001 and proc.cmdline startswith "otelcol-contrib --config=/conf/collector.yaml") or
        (k8s.ns.name = "kopiur-system" and k8s.pod.name startswith "kopiur-webhook-" and container.name = "webhook"
          and proc.exepath = "/usr/local/bin/app" and user.uid = 65534) or
        (k8s.ns.name = "kopiur-system" and k8s.pod.name startswith "kopiur-controller-" and container.name = "controller"
          and proc.exepath = "/usr/local/bin/app" and user.uid = 65534
          and (proc.cmdline startswith "app --leader-elect=true" or proc.cmdline startswith "tokio-rt-worker --leader-elect=true")) or
        (k8s.ns.name = "kopiur-system" and k8s.pod.name startswith "kopia-primary-discovery-" and container.name = "mover"
          and proc.exepath = "/usr/local/bin/kopiur-mover" and user.uid = 65532 and proc.cmdline startswith "kopiur-mover") or
        (k8s.ns.name = "kopiur-system" and k8s.pod.name startswith "kopia-primary-q-" and container.name = "mover"
          and proc.exepath = "/usr/local/bin/kopiur-mover" and user.uid = 65532 and proc.cmdline startswith "kopiur-mover") or
        (k8s.ns.name = "policy" and k8s.pod.name startswith "kyverno-reports-controller-" and container.name = "controller"
          and proc.exepath = "/ko-app/reports-controller" and user.uid = 65534 and proc.cmdline startswith "reports-control") or
        (k8s.ns.name = "policy" and k8s.pod.name startswith "kyverno-admission-controller-" and container.name = "kyverno"
          and proc.exepath = "/ko-app/kyverno" and user.uid = 65534 and proc.cmdline startswith "kyverno --caSecretName") or
        (k8s.ns.name = "policy" and k8s.pod.name startswith "kyverno-background-controller-" and container.name = "controller"
          and proc.exepath = "/ko-app/background-controller" and user.uid = 65534 and proc.cmdline startswith "background-cont --enableTracing") or
        (k8s.ns.name = "kopiur-system" and k8s.pod.name startswith "kopia-primary-f-" and container.name = "mover"
          and proc.exepath = "/usr/local/bin/kopiur-mover" and user.uid = 65532 and proc.cmdline startswith "kopiur-mover") or
        (k8s.ns.name = "argocd" and k8s.pod.name startswith "argocd-server-" and container.name = "server"
          and proc.exepath = "/usr/local/bin/argocd" and user.uid = 999 and proc.cmdline startswith "argocd-server") or
        (k8s.ns.name = "argocd" and k8s.pod.name startswith "argocd-redis-secret-init-" and container.name = "secret-init"
          and proc.exepath = "/usr/local/bin/argocd" and user.uid = 999 and proc.cmdline startswith "argocd admin redis-initial-password") or
        (k8s.ns.name = "database" and k8s.pod.name startswith "cloudnative-pg-" and container.name = "manager"
          and proc.exepath = "/operator/manager_amd64" and user.uid = 10001 and proc.cmdline startswith "manager controller") or
        (k8s.ns.name = "policy" and k8s.pod.name startswith "kyverno-migrate-resources-" and container.name = "kyverno-cli"
          and proc.exepath = "/ko-app/kubectl-kyverno" and user.uid = 65534 and proc.cmdline startswith "kubectl-kyverno migrate") or
        (k8s.ns.name = "istio-system" and k8s.pod.name startswith "istiod-" and container.name = "discovery"
          and proc.exepath = "/usr/local/bin/pilot-discovery") or
        (k8s.ns.name = "rook-ceph" and k8s.pod.name startswith "rook-ceph.rbd.csi.ceph.com-ctrlplugin-" and container.name = "csi-provisioner"
          and proc.exepath = "/csi-provisioner") or
        (k8s.ns.name = "rook-ceph" and k8s.pod.name startswith "rook-ceph.rbd.csi.ceph.com-ctrlplugin-" and container.name = "csi-attacher"
          and proc.exepath = "/csi-attacher") or
        (k8s.ns.name = "observability" and k8s.pod.name startswith "phoenix-postgres-" and container.name = "postgres"
          and proc.exepath = "/controller/manager") or
        (k8s.ns.name = "observability" and k8s.pod.name startswith "gatus-postgres-" and container.name = "postgres"
          and proc.exepath = "/controller/manager") or
        (k8s.ns.name = "database" and k8s.pod.name startswith "dragonfly-operator-" and container.name = "app"
          and proc.exepath = "/manager") or
        (k8s.ns.name = "media" and k8s.pod.name startswith "immich-v2-" and container.name = "postgres"
          and proc.exepath = "/controller/manager") or
        (k8s.ns.name = "default" and k8s.pod.name startswith "harbor-postgres-" and container.name = "postgres"
          and proc.exepath = "/controller/manager") or
        (k8s.ns.name = "observability" and k8s.pod.name startswith "opentelemetry-kube-stack-kube-state-metrics-" and container.name = "kube-state-metrics"
          and proc.exepath = "/kube-state-metrics") or
        (k8s.ns.name = "istio-system" and k8s.pod.name startswith "istio-cni-node-" and container.name = "install-cni"
          and proc.exepath = "/usr/local/bin/install-cni") or
        (k8s.ns.name = "network" and k8s.pod.name startswith "cloudflare-dns-" and container.name = "external-dns"
          and proc.exepath = "/ko-app/external-dns") or
        (k8s.ns.name = "openebs-system" and k8s.pod.name startswith "openebs-localpv-provisioner-" and container.name = "openebs-localpv-provisioner"
          and proc.exepath = "/usr/local/bin/provisioner-localpv") or
        (k8s.ns.name = "security" and k8s.pod.name startswith "authentik-worker-" and container.name = "worker"
          and proc.exepath = "/usr/local/bin/python3.14" and user.uid = 1000
          and proc.cmdline startswith "Thread-" and proc.cmdline contains "-m lifecycle.worker_process") or
        (k8s.ns.name = "rook-ceph" and k8s.pod.name startswith "rook-ceph.rbd.csi.ceph.com-ctrlplugin-" and container.name = "csi-rbdplugin"
          and proc.exepath = "/usr/local/bin/cephcsi" and user.uid = 0
          and proc.cmdline startswith "cephcsi --type=rbd" and proc.cmdline contains "--controllerserver=true") or
        (k8s.ns.name = "observability" and k8s.pod.name = "gatus-0" and container.name = "gatus-sidecar"
          and proc.exepath = "/gatus-sidecar" and user.uid = 1000 and proc.cmdline startswith "gatus-sidecar") or
        (k8s.ns.name = "system-upgrade" and k8s.pod.name startswith "tuppr-" and container.name = "manager"
          and proc.exepath = "/manager" and user.uid = 65532 and proc.cmdline startswith "manager --log-level=info") or
        ((k8s.ns.name = "comms" or k8s.ns.name = "default" or k8s.ns.name = "games" or k8s.ns.name = "media" or
          k8s.ns.name = "observability" or k8s.ns.name = "opencloud" or k8s.ns.name = "security") and container.name = "mover"
          and proc.exepath = "/usr/local/bin/kopiur-mover" and proc.cmdline startswith "kopiur-mover")

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

falcoctl:
  config:
    artifact:
      install:
        # Pinned to a reviewed release. Bump through a PR, not at runtime.
        refs: [falco-rules:5.2.0]
      follow:
        refs: [falco-rules:5.2.0]
  artifact:
    install:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    follow:
      # Disabled: rules change only through a PR, never at runtime.
      enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

metrics:
  enabled: true

serviceMonitor:
  create: true

falcosidekick:
  enabled: true
  # Explicit non-root, so the policy does not depend on the default user.
  podSecurityContext:
    runAsNonRoot: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
  config:
    loki:
      hostport: http://loki-gateway.observability.svc.cluster.local
      format: json
      minimumpriority: debug
    alertmanager:
      hostport: http://mimir-alertmanager.observability.svc.cluster.local:8080
      endpoint: /alertmanager/api/v2/alerts
      minimumpriority: warning
      # Keep the existing Discord routing: critical/alert/emergency hit discord-critical
      # (pings), everything else lands on the plain discord route.
      customseveritymap: "emergency:critical,alert:critical,critical:critical,error:warning,warning:warning"
      expireafter: "300"
