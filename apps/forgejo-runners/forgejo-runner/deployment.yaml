---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
          securityContext:
            # Stays root (runAsUser: 0): the image has no non-root user, and
            # it needs to reach the dind sidecar's docker.sock, which is
            # root:docker owned. No longer privileged though — it doesn't
            # need host device access, only the dind container does. See
            # the forgejo-runner-dind-privileged PolicyException.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - "sh"
            - "-c"
            - |
              while [ ! -S /run/user/1000/docker.sock ]; do
                echo 'waiting for docker daemon...';
                sleep 5;
              done
              /bin/forgejo-runner --config /etc/runner/config.yaml daemon
          env:
            - name: DOCKER_HOST
              value: unix:///run/user/1000/docker.sock
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: runner-configfile
              mountPath: /etc/runner
            - name: docker-sock
              mountPath: /run/user/1000
            - name: runner-data
              mountPath: /data
        # Rootless Docker: the daemon runs as uid 1000 inside its own user namespace, so the
        # container is not privileged. Rootless needs an unconfined seccomp profile to create
        # user namespaces, and Talos already allows them (user.max_user_namespaces).
        - name: dind
          image: docker:29.3.1-dind-rootless@sha256:5fd70e50e710078a3c8c3eaa96c0e788740ee71934f48efce17573a47db7cf4b
          env:
            # Rootless rootlesskit cannot create its tap0 device without privileges, so the
            # daemon uses the pod's network namespace. The container is still not privileged.
            - name: DOCKERD_ROOTLESS_ROOTLESSKIT_NET
              value: host
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            # newuidmap is setuid root and must be able to set the user-namespace mapping, so
            # escalation stays allowed and SETUID/SETGID are granted. Nothing else is.
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: docker-sock
              mountPath: /run/user/1000
      volumes:
        - name: docker-sock
          emptyDir: {}
        - name: runner-configfile
          secret:
            secretName: forgejo-runner-configfile
        # The image bakes in /data owned by uid/gid 1000, but this container
        # runs as root (see above) and was getting "permission denied"
        # writing to it — breaking every job at the actions/checkout step,
        # which clones into $data/.cache/act. A fresh emptyDir sidesteps the
        # image's pre-baked ownership entirely.
        - name: runner-data
          emptyDir: {}
