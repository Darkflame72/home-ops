---
# Namespace for per-job Pods created by the Kubernetes execution plugin.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-jobs
---
# The plugin may only create, read, delete Pods and exec into them, and only in
# forgejo-jobs. No list/watch, secrets, or cluster-scoped access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-jobs
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-kubernetes
    namespace: forgejo-runners
roleRef:
  kind: Role
  name: forgejo-runner-kubernetes
  apiGroup: rbac.authorization.k8s.io
---
# Job Pods run untrusted CI steps. They get internet egress (for pulls, git,
# and downloads) and DNS, and nothing else in the cluster. They can't reach the
# plugin's gRPC port or other workloads. Ingress is limited to the kubelet, which
# serves pods/exec. Upstream says job Pods get no ServiceAccount token, which is
# set in the plugin code (automountServiceAccountToken: false).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-job-pods
  namespace: forgejo-jobs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: forgejo-runner-kubernetes
  ingress:
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
