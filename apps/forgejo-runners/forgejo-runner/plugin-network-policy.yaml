---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# Upstream's plugin accepts plaintext gRPC with no authentication, so any Pod
# that can reach it can ask it to create Pods. Only the trusted runner may
# connect. The plugin itself only needs DNS and the Kubernetes API (it creates
# job Pods and execs into them through the API server).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner-kubernetes-plugin
  namespace: forgejo-runners
spec:
  endpointSelector:
    matchLabels:
      app: forgejo-runner-kubernetes
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: forgejo-runner
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
