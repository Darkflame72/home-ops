---
image:
  repository: itzg/mc-router
  # renovate: datasource=docker depName=itzg/mc-router
  tag: 1.46.3@sha256:b4f2164696a00bad09776ddc1042cf7e85f4d9b327761e4ff296795c977d9b72
  pullPolicy: IfNotPresent

services:
  minecraft:
    type: LoadBalancer
    port: 25565
    annotations:
      lbipam.cilium.io/ips: 10.0.60.16 # pinned so the router port-forward stays valid

minecraftRouter:
  mappings:
    - externalHostname: "mc.darkflame.dev"
      host: minecraft.games.svc.cluster.local
      port: 25565
  autoScale:
    up: { enabled: false }
    down: { enabled: false }

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
