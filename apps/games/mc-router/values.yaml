---
image:
  repository: itzg/mc-router
  # renovate: datasource=docker depName=itzg/mc-router
  tag: 1.46.2@sha256:802a6adef1a298fd0557b6c2223b94a7bc06cd16a007315d5ba2f498e72ce5de
  pullPolicy: IfNotPresent

services:
  minecraft:
    type: LoadBalancer
    port: 25565
    annotations:
      lbipam.cilium.io/ips: 10.0.60.16 # pinned so the router port-forward stays valid

minecraftRouter:
  mappings:
    - externalHostname: "mc.darkflame.dev"
      host: minecraft.games.svc.cluster.local
      port: 25565
  autoScale:
    up: { enabled: false }
    down: { enabled: false }

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
