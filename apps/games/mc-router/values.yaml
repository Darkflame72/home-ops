---
image:
  repository: itzg/mc-router
  # renovate: datasource=docker depName=itzg/mc-router
  tag: 1.52.0@sha256:7c71e11ae3ab3b10c2f6e0090c0cee5544bbbb8f8f02b83ea696b8a182d3eca0
  pullPolicy: IfNotPresent

services:
  minecraft:
    type: LoadBalancer
    port: 25565
    annotations:
      lbipam.cilium.io/ips: 10.0.60.16 # pinned so the router port-forward stays valid

minecraftRouter:
  mappings:
    - externalHostname: "mc.darkflame.dev"
      host: minecraft.games.svc.cluster.local
      port: 25565
  autoScale:
    up: { enabled: false }
    down: { enabled: false }

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# itzg/mc-router runs as UID 65532 (distroless) by default; the chart just
# doesn't set securityContext itself. Satisfies require-run-as-nonroot.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
