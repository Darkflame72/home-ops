---
image:
  repository: itzg/mc-router
  # renovate: datasource=docker depName=itzg/mc-router
  tag: 1.47.2@sha256:64ae69eaa7a6800a79bbf962f027f4020878efa25183359115bc7f6ee569c36e
  pullPolicy: IfNotPresent

services:
  minecraft:
    type: LoadBalancer
    port: 25565
    annotations:
      lbipam.cilium.io/ips: 10.0.60.16 # pinned so the router port-forward stays valid

minecraftRouter:
  mappings:
    - externalHostname: "mc.darkflame.dev"
      host: minecraft.games.svc.cluster.local
      port: 25565
  autoScale:
    up: { enabled: false }
    down: { enabled: false }

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# itzg/mc-router runs as UID 65532 (distroless) by default; the chart just
# doesn't set securityContext itself. Satisfies require-run-as-nonroot.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
