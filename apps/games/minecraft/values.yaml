---
image:
  repository: itzg/minecraft-server
  # renovate: datasource=docker depName=itzg/minecraft-server
  tag: 2026.8.0@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    memory: 6Gi # no cpu limit — avoids JVM GC stalls from CPU throttling

persistence:
  storageClass: ceph-block
  dataDir:
    enabled: true
    existingClaim: minecraft-data # PVC defined in pvc.yaml, so kopiur can back it up

minecraftServer:
  eula: "TRUE"
  type: "PAPER"
  version: "LATEST"
  memory: "4G"
  difficulty: normal
  whitelist: "darkflame72"
  motd: "Welcome!"
  servicePort: 25565

  modrinth:
    projects:
      - squaremap
      - chunky
      - chunkyborder
    downloadDependencies: none

  extraPorts:
    - name: map
      containerPort: 8080
      protocol: TCP
      service:
        enabled: true
        type: ClusterIP
        port: 8080
