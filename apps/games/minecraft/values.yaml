---
image:
  repository: itzg/minecraft-server
  # renovate: datasource=docker depName=itzg/minecraft-server
  tag: 2026.8.1@sha256:1bfb278ea9ee9a319ff2b6ebf6e996e7217fbcd825a925f6382d05bd348c046b
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    memory: 6Gi # no cpu limit — avoids JVM GC stalls from CPU throttling

persistence:
  storageClass: ceph-block
  dataDir:
    enabled: true
    existingClaim: minecraft-data # PVC defined in pvc.yaml, so kopiur can back it up

minecraftServer:
  eula: "TRUE"
  type: "PAPER"
  version: "LATEST"
  memory: "4G"
  difficulty: normal
  whitelist: "darkflame72"
  ops: "darkflame72"
  maxPlayers: 20
  spawnProtection: 0
  vanillaTweaksShareCodes:
    - "ZHRhv6"
  motd: "Welcome!"
  servicePort: 25565

  modrinth:
    projects:
      - squaremap
      - chunky
      # chunkyborder omitted: its newest Paper build only supports up to MC 1.21.11,
      # no release yet for 26.2 (what VERSION: LATEST currently resolves to) — would
      # crash-loop the same way the earlier Pl3xMap version-type mismatch did. Add back
      # once a 26.2-compatible build is published.
      - discordsrv
    downloadDependencies: none

  extraPorts:
    - name: map
      containerPort: 8080
      protocol: TCP
      service:
        enabled: true
        type: ClusterIP
        port: 8080

# Seeds DiscordSRV's config.yml (bot token + channel mapping, from Infisical via
# external-secret.yaml) onto the writable data PVC before Paper starts. The copy
# (not a direct mount) keeps /data/plugins/DiscordSRV writable so the plugin can
# still self-heal/rewrite the file at runtime; GitOps reasserts the seed on every
# pod restart.
extraVolumes:
  - volumeMounts:
      - name: discordsrv-config-seed
        mountPath: /config-seed
        readOnly: true
    volumes:
      - name: discordsrv-config-seed
        secret:
          secretName: minecraft-discordsrv-config

initContainers:
  - name: seed-discordsrv-config
    # renovate: datasource=docker depName=docker.io/library/busybox
    image: docker.io/library/busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["sh", "-c", "mkdir -p /data/plugins/DiscordSRV && cp /config-seed/config.yml /data/plugins/DiscordSRV/config.yml"]
    volumeMounts:
      - name: datadir
        mountPath: /data
      - name: discordsrv-config-seed
        mountPath: /config-seed
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
