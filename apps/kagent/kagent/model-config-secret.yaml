---
# The kagent chart's templated ModelConfig (providers.openAI in values.yaml)
# references this secret by name (apiKeySecretRef), but agentgateway -- not
# kagent -- holds the real vendor credential and injects it upstream when
# the request reaches apps/agents/agentgateway/llm.yaml. This key is never
# actually checked or used by anything; it only exists because ModelConfig's
# apiKeySecret field is required. A plain Secret (rather than ExternalSecret
# from Infisical, the norm elsewhere in this repo) is intentional here:
# there's no real secret material to manage.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-agentgateway-llm
  namespace: kagent
type: Opaque
stringData:
  OPENAI_API_KEY: not-required
