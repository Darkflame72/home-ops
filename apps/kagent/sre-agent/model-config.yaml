---
# No yaml-language-server schema available: kagent.dev/v1alpha2 ModelConfig
#
# Points at agentgateway's OpenAI-compatible LLM route (apps/agents/agentgateway/llm.yaml)
# instead of a vendor API directly. agentgateway holds the real vendor API
# key and injects it upstream, so this ModelConfig never needs to change
# again even if the vendor behind agentgateway's AgentgatewayBackend does.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: default-model-config
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-5-mini
  apiKeySecret: kagent-agentgateway-llm
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: "http://agentgateway-proxy.agents.svc.cluster.local/v1"
---
# agentgateway (not kagent) holds the real vendor credential and injects it
# upstream -- this key is never actually checked or used by anything, it
# only exists to satisfy the ModelConfig CRD's required apiKeySecret field.
# A plain Secret (rather than ExternalSecret from Infisical, the norm
# elsewhere in this repo) is intentional here: there's no real secret
# material to manage.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-agentgateway-llm
  namespace: kagent
type: Opaque
stringData:
  OPENAI_API_KEY: not-required
