---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopia-primary
spec:
  backend:
    s3:
      bucket: kopia
      endpoint: 10.0.60.15:30188
      region: garage
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopia-s3-secret
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopia-s3-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  allowedNamespaces:
    list:
      - comms
      - default
      - games
      - kopiur-system
      - media
      - observability
      - security
      - opencloud
  server:
    namespace: kopiur-system
    auth:
      generate: {}
    service:
      type: ClusterIP
      port: 51515
  parameters:
    epoch:
      # Index epochs advance at most every 6h, so the content-index blobs compact more often.
      minDuration: 6h
  maintenance:
    # Force: with Never the lease is not re-taken from its current holder, and compaction stops.
    # Set Never again only after the index-blob health condition reports healthy for a full cycle.
    takeoverPolicy: Force
    schedule:
      full:
        cron: 0 */6 * * *
        jitter: 1h
      quick:
        cron: 0 */6 * * *
        jitter: 30m
