---
# No yaml-language-server schema available: coredns/helm (no values.schema.json)
fullnameOverride: coredns
image:
  repository: mirror.gcr.io/coredns/coredns
podSecurityContext:
  # Kubelet can't verify non-root for images with a non-numeric USER
  # (nonroot here) — needs an explicit numeric UID or it refuses to
  # start with CreateContainerConfigError.
  runAsNonRoot: true
  runAsUser: 65532
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.43.0.10"
replicaCount: 2
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
        configBlock: |-
          class error
  - zones:
      - zone: darkflame.dev
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: cache
        configBlock: |-
          prefetch 20
      - name: template
        # Cloudflare-proxied darkflame.dev hosts (auth, blog, kromgo, kagent,
        # renovate's OIDC redirect target, etc.) have real public AAAA
        # records, but Pi-hole only holds local A overrides for them — AAAA
        # queries fall through Pi-hole to its public upstream and come back
        # with a real Cloudflare IPv6 address. The cluster has no IPv6
        # route, so clients that race A/AAAA (gatus, and anything else doing
        # HTTPS to these hosts) intermittently dial the unreachable v6
        # address and fail outright instead of falling back to v4. Short-
        # circuit AAAA for the whole zone with NODATA so only the
        # (reachable) A record is ever returned. Confirmed live 2026-08-09
        # investigating gatus false-positive alerts for renovate/ghost/
        # authentik-server/kromgo/grafana/kagent-ui.
        parameters: IN AAAA darkflame.dev
      - name: forward
        # darkflame.dev has private-only records (e.g. harbor.darkflame.dev)
        # that only exist in Pi-hole, not public DNS — the default `.` zone
        # block below forwards to /etc/resolv.conf (Cloudflare), which can't
        # see them. Stub this one zone to Pi-hole instead of repointing every
        # node's base resolver, so only darkflame.dev lookups depend on it.
        parameters: . 192.168.1.2
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
