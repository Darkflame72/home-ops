---
kind: CronJob
schedule: "*/20 * * * *"

service:
  enabled: true

serviceMonitor:
  enabled: true

deschedulerPolicy:
  # Temporary for initial rollout of LowNodeUtilization; remove once
  # behavior is verified stable (see plan for the verification steps).
  maxNoOfPodsToEvictPerNode: 3
  maxNoOfPodsToEvictTotal: 6
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            # Pods with emptyDir volumes (postgres clusters, minecraft, argocd repo-server) were never evictable, which
            # left nodes that were overloaded with them stuck. Allow them, but never a CNPG primary (that forces a
            # failover) and never Rook mon, mgr or OSD pods (that starts Ceph data movement). Reviewed 2026-10-25.
            evictLocalStoragePods: true
            labelSelector:
              matchExpressions:
                - key: cnpg.io/instanceRole
                  operator: NotIn
                  values: ["primary"]
                - key: app
                  operator: NotIn
                  values: ["rook-ceph-osd", "rook-ceph-mon", "rook-ceph-mgr"]
            podProtections:
              extraEnabled:
                - PodsWithPVC
              config:
                PodsWithPVC:
                  protectedStorageClasses:
                    - name: openebs-hostpath
        - name: RemoveDuplicates
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: RemoveFailedPods
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 100
            includingInitContainers: true
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 65
              memory: 65
            targetThresholds:
              cpu: 75
              memory: 80
            evictionLimits:
              node: 2
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity
            - RemoveFailedPods
            - RemovePodsHavingTooManyRestarts
        filter:
          enabled:
            - DefaultEvictor
