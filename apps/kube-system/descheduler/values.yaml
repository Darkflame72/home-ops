---
kind: CronJob
schedule: "*/20 * * * *"

service:
  enabled: true

serviceMonitor:
  enabled: true

deschedulerPolicy:
  # Temporary for initial rollout of LowNodeUtilization; remove once
  # behavior is verified stable (see plan for the verification steps).
  maxNoOfPodsToEvictPerNode: 3
  maxNoOfPodsToEvictTotal: 6
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              extraEnabled:
                - PodsWithPVC
              config:
                PodsWithPVC:
                  protectedStorageClasses:
                    - name: openebs-hostpath
        - name: RemoveDuplicates
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: RemoveFailedPods
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 100
            includingInitContainers: true
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 60
              memory: 60
            targetThresholds:
              cpu: 75
              memory: 80
            evictionLimits:
              node: 2
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity
            - RemoveFailedPods
            - RemovePodsHavingTooManyRestarts
        filter:
          enabled:
            - DefaultEvictor
