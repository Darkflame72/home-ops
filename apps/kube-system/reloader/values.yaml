---
# No yaml-language-server schema available: stakater/Reloader (no values.schema.json)
fullnameOverride: reloader
reloader:
  readOnlyRootFileSystem: true
  podMonitor:
    enabled: true
  deployment:
    # Container keys of the reloader chart. Reloader only watches ConfigMaps and Secrets through
    # the API, so no capabilities or privilege escalation are needed.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 10m
        memory: 112Mi
      limits:
        memory: 448Mi
