---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# Target of the PG16 -> PG18 migration (cutover done). Schema and data were
# moved in via logical replication; the bootstrap import and subscription
# have been removed now that the migration is complete.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg18
  namespace: media
spec:
  instances: 3
  # Read-only monitoring login for the OTel postgresql receiver (pg_monitor).
  # Password comes from the pg-monitor-secret ClusterExternalSecret.
  managed:
    roles:
      - name: otel_monitor
        ensure: present
        login: true
        inRoles:
          - pg_monitor
        passwordSecret:
          name: pg-monitor-secret
  primaryUpdateStrategy: unsupervised

  # Istio ambient opt-out for the CNPG pods.
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: none

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1

  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      memory: 4Gi

  storage:
    size: 25Gi
    storageClass: openebs-hostpath

  bootstrap:
    initdb:
      database: immich
      owner: immich

  postgresql:
    shared_preload_libraries:
    - vchord.so

  env:
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: cnpg-backup-secret
        key: REGION

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-pg18
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-pg18-backup
  namespace: media
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-pg18
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
