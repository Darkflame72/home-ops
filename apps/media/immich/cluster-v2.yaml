---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-v2
  namespace: media
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised

  # media is enrolled in the Istio ambient mesh, which breaks CNPG's own TLS
  # + streaming-replication protocol on 5432 (see apps/default/nextcloud/
  # cluster.yaml for the incident). Opt out of ambient capture, same as
  # redis.yaml in this app.
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: none

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-1.1.1

  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      memory: 4Gi

  storage:
    size: 25Gi
    storageClass: openebs-hostpath

  bootstrap:
    recovery:
      source: immich-backup
      database: immich
      owner: immich

  externalClusters:
    - name: immich-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-backup
          serverName: immich

  postgresql:
    shared_preload_libraries:
    - vchord.so

  env:
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: cnpg-backup-secret
        key: REGION

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-v2
