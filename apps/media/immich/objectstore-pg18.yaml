---
# Separate archive for the PG18 cluster so PG16 and PG18 WAL never mix.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-pg18
  namespace: media
spec:
  configuration:
    destinationPath: s3://cnpg/immich-pg18
    endpointURL: http://10.0.60.15:30188
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-secret
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
