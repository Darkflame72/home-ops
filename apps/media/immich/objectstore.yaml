---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-v2
  namespace: media
spec:
  configuration:
    destinationPath: s3://cnpg/immich-v2
    endpointURL: http://10.0.60.15:30188
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-secret
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
---
# Read-only source for the legacy bootstrap.recovery (externalClusters immich-backup).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-backup
  namespace: media
spec:
  configuration:
    destinationPath: s3://cnpg/immich
    endpointURL: http://10.0.60.15:30188
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-secret
        key: REGION
