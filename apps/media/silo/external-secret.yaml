# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: silo-secret
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /silo/secret-key
  - secretKey: MEILI_MASTER_KEY
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /silo/meili-master-key
  - secretKey: REDIS_PASSWORD
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /silo/redis-password
  - secretKey: SILO_OIDC_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /silo/oauth2-client-secret
