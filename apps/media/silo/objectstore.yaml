# Separate archive for Silo's cluster; barman-cloud WAL and base backups.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: silo-pg
  namespace: media
spec:
  configuration:
    destinationPath: s3://cnpg/silo-pg
    endpointURL: http://10.0.60.15:30188
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-secret
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    # The barman-cloud sidecar is injected into every CNPG instance pod with no resources.
    # That fails require-requests-limits (Kyverno, medium), so set them here.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
  retentionPolicy: "30d"
