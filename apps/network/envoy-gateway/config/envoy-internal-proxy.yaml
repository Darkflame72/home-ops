---
# Copy of the shared EnvoyProxy for the LAN gateway, with a read-only root filesystem, so the
# change can be tested on one gateway before the public one.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-internal
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          # Read-only root filesystem. Tested on the internal (LAN) gateway first.
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
        pod:
          labels:
            # Enrolls only these Envoy proxy pods in the Istio ambient mesh, so
            # backend traffic is HBONE mTLS. Pod-level rather than a namespace label,
            # so cloudflared and the other network-namespace pods stay unmeshed.
            istio.io/dataplane-mode: ambient
          annotations:
            # The envoy-proxy PodMonitor already scrapes these proxies. Envoy Gateway's default
            # prometheus.io/scrape annotation also made the daemon collector scrape them, so
            # every envoy series was stored twice.
            prometheus.io/scrape: "false"
      envoyService:
        externalTrafficPolicy: Cluster
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Gzip
      sinks:
        - type: OpenTelemetry
          openTelemetry:
            host: opentelemetry-kube-stack-daemon-collector.observability.svc.cluster.local
            port: 4317
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        port: 4317
        backendRefs:
          - group: ""
            kind: Service
            name: opentelemetry-kube-stack-daemon-collector
            namespace: observability
            port: 4317
            weight: 1
