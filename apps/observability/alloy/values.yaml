controller:
  type: deployment
  replicas: 1

alloy:
  # Grafana's documented non-root setup. The only thing Alloy does here is sync
  # PrometheusRules to Mimir over the API, which needs no host or root access.
  securityContext:
    runAsUser: 473
    runAsGroup: 473
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      memory: 448Mi
  configMap:
    content: |
      mimir.rules.kubernetes "sync" {
        address = "http://mimir-gateway.observability.svc.cluster.local"
      }

configReloader:
  resources:
    limits:
      memory: 128Mi
