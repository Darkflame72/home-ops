---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: truenas-node-exporter
  namespace: observability
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: truenas
  # grafana.com 1860 carries uid rYdddlPWk, the same as the in-cluster node-exporter-full dashboard.
  # Giving this copy its own uid stops the two imports overwriting each other.
  uid: truenas-node-exporter
  grafanaCom:
    id: 1860
    revision: 45
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "Mimir"
