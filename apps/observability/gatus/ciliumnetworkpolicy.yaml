---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.jsonapiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability-egress-default-deny
  namespace: observability
spec:
  endpointSelector: {}
  enableDefaultDeny:
    egress: true
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - cluster
        - kube-apiserver
    - toFQDNs:
        - matchName: "discord.com"
        - matchPattern: "*.darkflame.dev"
        # Pod resolver tries the namespace search suffix before the bare
        # name (ndots:5 in /etc/resolv.conf), and Cilium tracks the FQDN
        # exactly as queried/answered — confirmed live 2026-07-20 via
        # `cilium-dbg fqdn cache list` showing entries like
        # "pdf.darkflame.dev.observability.svc.cluster.local", which
        # *.darkflame.dev alone doesn't match. Without this, every gatus
        # "external" group check breaks and fires false-positive alerts.
        - matchPattern: "*.darkflame.dev.observability.svc.cluster.local"
        # Same search-suffix issue hits discord.com too, but only for some
        # clients: gatus's own Go resolver queries the bare name cleanly,
        # but mimir-alertmanager's queries get search-suffixed — confirmed
        # live 2026-07-20 (`cilium-dbg fqdn cache list` showing
        # "discord.com.observability.svc.cluster.local", not
        # "discord.com."), which silently broke every Alertmanager Discord
        # notification (TLS handshake timeout / connection reset).
        - matchName: "discord.com.observability.svc.cluster.local"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - "1.1.1.1/32"
        - "8.8.8.8/32"
        - "9.9.9.9/32"
        - "10.0.60.15/32"
      icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
    # 10.0.60.15:30188 is Garage (S3-compatible), running on the same LAN
    # appliance as the TrueNAS check above. gatus-postgres (CNPG) archives
    # WAL/backups there continuously — the ICMP-only rule above covers
    # gatus's own ping check but not this TCP traffic, missed in the
    # original audit. Caught 2026-08-08 while investigating a stuck CNPG
    # replica elsewhere; gatus-postgres backups had been failing since
    # 2026-07-20 as a result.
    - toCIDR:
        - "10.0.60.15/32"
      toPorts:
        - ports:
            - port: "30188"
              protocol: TCP
