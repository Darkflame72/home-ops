---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanafolder_v1beta1.json
# One GrafanaFolder per dashboard group. The uid is what dashboards reference:
# GrafanaDashboard.spec.folderUID, and the grafana_folder annotation on dashboard ConfigMaps.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: mimir
  namespace: observability
spec:
  uid: mimir
  title: Mimir
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
---
