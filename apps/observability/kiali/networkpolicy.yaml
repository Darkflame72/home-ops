# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiali-ambient-hbone
  namespace: observability
spec:
  # The kiali chart's NetworkPolicy only opens 20001 and 9090. Ambient traffic from ztunnel arrives on the
  # HBONE port 15008, so the mesh's scrapes and API calls were dropped at the pod. This is additive: the
  # chart policy still applies. Reviewed 2026-10-24.
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kiali
      app.kubernetes.io/name: kiali
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 15008
          protocol: TCP
