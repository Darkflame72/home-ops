---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/opentelemetry.io/opentelemetrycollector_v1beta1.json
# Scrapes control-plane metrics that only exist on the node itself. etcd listens on
# 127.0.0.1:2381 (talos/patches/control-plane/cluster.yaml), so this collector runs with
# hostNetwork on control-plane nodes and reaches that loopback address. Other collectors
# cannot reach it, which is the point: the endpoint is not exposed to the LAN or pod network.
# The node name goes into the instance label, because every control-plane node serves the
# same loopback address and series would otherwise collide in Mimir.
#
# It also ships the kube-apiserver audit log (Talos writes it to /var/log/audit/kube on each
# control-plane node) to Loki through the gateway. Only this collector sees the control-plane
# host, so the audit receiver lives here, not in the daemon collector.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: control-plane
  namespace: observability
spec:
  mode: daemonset
  hostNetwork: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # The audit file is owned by uid/gid 65534 (the same reason the Fluent Bit audit shipper runs
  # as this user), so the collector does not need root to read it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  volumes:
    - name: audit-log
      hostPath:
        path: /var/log/audit/kube
  volumeMounts:
    - name: audit-log
      mountPath: /var/log/audit/kube
      readOnly: true
  podAnnotations:
    # Self-telemetry on :8888, picked up by the daemon's annotation scrape.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: etcd
              scrape_interval: 30s
              static_configs:
                - targets: ["127.0.0.1:2381"]
                  labels:
                    component: etcd
              relabel_configs:
                - target_label: instance
                  replacement: ${env:NODE_NAME}
      filelog/audit:
        include:
          - /var/log/audit/kube/kube-apiserver.log
        # Only new lines after a fresh start, matching the Fluent Bit shipper.
        start_at: end
        # Each line is one JSON audit event. Parsed fields become attributes, so they can be
        # filtered and queried in Loki; the raw JSON stays in the log body.
        operators:
          - type: json_parser
        retry_on_failure:
          enabled: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch: {}
      # Same noise cuts as the Fluent Bit shipper: lease and event churn, health probes, and
      # Kyverno's own API traffic (trusted, and about half the volume). Secret and RBAC events
      # are kept.
      filter/audit:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(attributes["requestURI"], "^/(livez|readyz|healthz)")'
            - 'attributes["objectRef"]["resource"] == "leases" or attributes["objectRef"]["resource"] == "events" or attributes["objectRef"]["resource"] == "selfsubjectaccessreviews" or attributes["objectRef"]["resource"] == "subjectaccessreviews"'
            - 'IsMatch(attributes["user"]["username"], "^system:serviceaccount:policy:kyverno-")'
      resource/audit:
        attributes:
          - action: insert
            key: service.name
            value: kube-audit
    exporters:
      # Every collector sends through the gateway, which is the only path to Mimir and Loki.
      otlp/gateway:
        endpoint: opentelemetry-kube-stack-gateway-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
    extensions:
      health_check: {}
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
        logs/audit:
          receivers: [filelog/audit]
          processors: [memory_limiter, filter/audit, resource/audit, batch]
          exporters: [otlp/gateway]
