# No yaml-language-server schema available: open-telemetry/opentelemetry-kube-stack
instrumentation:
  enabled: true
  exporter:
    endpoint: http://opentelemetry-kube-stack-daemon-collector.observability.svc.cluster.local:4317
  sampler:
    type: parentbased_always_on

opentelemetry-operator:
  manager:
    podLabels:
      istio.io/dataplane-mode: none
    collectorImage:
      repository: otel/opentelemetry-collector-contrib
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 384Mi

kubeStateMetrics:
  enabled: true

# Control-plane scrapers. etcd is scraped by the control-plane collector (it listens on loopback),
# CoreDNS by the coredns job above, kube-proxy is off because Cilium replaces it.
kubernetesServiceMonitors:
  enabled: true
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true

kube-state-metrics:
  # Kept out of ambient: the cluster collector scrapes it through the mesh, and
  # HBONE delivery to this pod is refused. Plaintext scrapes reach it.
  podLabels:
    istio.io/dataplane-mode: none
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      memory: 512Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 15m
      memory: 48Mi
    limits:
      memory: 192Mi

defaultCRConfig:
  config:
    exporters:
      otlp_http/mimir:
        endpoint: http://mimir-gateway.observability.svc.cluster.local/otlp
        tls:
          insecure: true
      otlp_http/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
        tls:
          insecure: true
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      # Every collector sends its signals here. The gateway is the only
      # component that talks to storage: tail_sampling sees whole traces
      # before anything reaches Tempo.
      otlp/gateway:
        endpoint: opentelemetry-kube-stack-gateway-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true

# Single daemonset collector handles all signals.
# clusterMetrics and kubernetesEvents use the leader election extension to run only on one node.
collectors:
  cluster:
    enabled: true
    mode: statefulset
    replicas: 1
    presets:
      clusterMetrics:
        enabled: true
      kubernetesEvents:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    podAnnotations:
      # Self-telemetry on :8888, picked up by the daemon's annotation scrape.
      prometheus.io/scrape: "true"
      prometheus.io/port: "8888"
    # Password for the otel_monitor role (pg-monitor-secret, see apps/database/cloudnative-pg).
    # Optional, so a missing secret leaves the postgres receivers failing, not the collector down.
    env:
      - name: PG_MONITOR_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pg-monitor-secret
            key: password
            optional: true
    # Was 1Gi: the memory limiter (75% of the limit) started refusing scrape
    # data at ~715Mi of steady use, so raise the ceiling above that.
    resources:
      limits:
        cpu: 1000m
        memory: 1536Mi
      requests:
        cpu: 150m
        memory: 768Mi
    targetAllocator:
      enabled: true
      allocationStrategy: consistent-hashing
      # The target allocator only reads ScrapeConfigs and Services through the API, and writes nothing to disk.
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 25m
          memory: 288Mi
        limits:
          memory: 1152Mi
      prometheusCR:
        enabled: true
        scrapeInterval: 30s
        # node-exporter is scraped per node by the daemon collector
        # (daemon_scrape_configs.yaml). Scraping it here too doubled every
        # node_* series, and the duplicates broke the (cluster, instance) joins.
        serviceMonitorSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: NotIn
              values: [prometheus-node-exporter]
        podMonitorSelector: {}
    config:
      receivers:
        # Every CNPG cluster, found by label. The rule matches only the primary pod of each cluster, and the
        # receiver reads through the -rw service, so the host name still carries the cluster name for
        # the cnpg_cluster label. New clusters are picked up with no edit here.
        receiver_creator/cnpg:
          watch_observers: [k8s_observer]
          receivers:
            postgresql:
              rule: type == "pod" && labels["cnpg.io/podRole"] == "instance" && labels["cnpg.io/instanceRole"] == "primary" && labels["cnpg.io/cluster"] != "nextcloud-postgres"
              config:
                endpoint: '`labels["cnpg.io/cluster"]`-rw.`namespace`.svc.cluster.local:5432'
                username: otel_monitor
                password: ${env:PG_MONITOR_PASSWORD}
                collection_interval: 30s
                tls:
                  insecure_skip_verify: true
            # nextcloud-postgres revoked PUBLIC CONNECT on its app database (datacl app=CTc/app), so the
            # monitor role cannot connect to it. Exclude that database for this cluster only; the rest of
            # its metrics are collected. Every other cluster keeps the default of all databases.
            postgresql/nextcloud:
              rule: type == "pod" && labels["cnpg.io/podRole"] == "instance" && labels["cnpg.io/instanceRole"] == "primary" && labels["cnpg.io/cluster"] == "nextcloud-postgres"
              config:
                endpoint: 'nextcloud-postgres-rw.default.svc.cluster.local:5432'
                username: otel_monitor
                password: ${env:PG_MONITOR_PASSWORD}
                collection_interval: 30s
                exclude_databases: [app]
                tls:
                  insecure_skip_verify: true
        prometheus:
          config:
            scrape_configs:
              - job_name: truenas-node
                static_configs:
                  - targets:
                    - 10.0.60.15:9100
                    labels:
                      instance: truenas
              - job_name: truenas-smartctl
                static_configs:
                  - targets:
                    - 10.0.60.15:9633
                    labels:
                      instance: truenas
              - job_name: blackbox-nfs
                metrics_path: /probe
                params:
                  module: [tcp_connect]
                static_configs:
                  - targets:
                    - 10.0.60.15:2049
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: blackbox-exporter.observability.svc.cluster.local:9115
              - job_name: coredns
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [kube-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    action: keep
                    regex: kube-dns
                  - source_labels: [__meta_kubernetes_pod_ip]
                    replacement: $$1:9153
                    target_label: __address__
                  - target_label: job
                    replacement: coredns
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
          target_allocator:
            endpoint: http://opentelemetry-kube-stack-collector-targetallocator:80
            interval: 30s
            collector_id: ${POD_NAME}
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15
        transform/cluster_label:
          metric_statements:
            - context: datapoint
              statements:
                - set(attributes["cluster"], "home")
        batch:
          send_batch_size: 1000
          timeout: 1s
        # Copies the CNPG cluster name out of the -rw host (server.address) onto each datapoint or log,
        # since resource attributes are not promoted to labels in Mimir. Only the postgres pipelines use these.
        transform/pg_cluster:
          metric_statements:
            - context: datapoint
              statements:
                - set(attributes["cnpg_cluster"], resource.attributes["server.address"])
                - 'replace_pattern(attributes["cnpg_cluster"], "-rw\\..*", "")'
      extensions:
        k8s_observer:
          auth_type: serviceAccount
          observe_pods: true
      service:
        # Both leader-election extensions: the events receiver fails to start
        # unless its own extension is listed here.
        extensions: [k8s_leader_elector/k8s_cluster, k8s_leader_elector/k8s_objects, k8s_observer]
        pipelines:
          metrics:
            processors: [memory_limiter, transform/cluster_label, batch]
            exporters: [otlp/gateway]
          # kubernetesEvents preset receiver. Without this pipeline the events
          # are read and then dropped. Its leader-election extension must be
          # listed too, or the collector fails to start.
          logs:
            processors: [memory_limiter, batch]
            exporters: [otlp/gateway]
          # CNPG PostgreSQL metrics, all clusters. Same cluster-level label as the rest.
          metrics/postgres:
            receivers: [receiver_creator/cnpg]
            processors: [memory_limiter, transform/pg_cluster, transform/cluster_label, batch]
            exporters: [otlp/gateway]
  daemon:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    # Presets replace the chart's default daemon_scrape_configs.yaml (they are
    # mutually exclusive with it). They cover the same three jobs: node-exporter,
    # cAdvisor on the kubelet, and annotation-based pod scraping.
    scrape_configs_file: ""
    # Observed per-node usage is ~50-110m CPU and ~115-160Mi memory.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 320Mi
    podAnnotations:
      reloader.stakater.com/auto: "true"
      prometheus.io/scrape: "true"
      prometheus.io/port: "8888"
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              keepalive:
                enforcement_policy:
                  min_time: 10s
                  permit_without_stream: true
        # Talos enables kube-apiserver audit logging by default (Metadata
        # level, /var/log/audit/kube on each control-plane node) but never
        # ships those logs anywhere. hostMetrics preset already mounts the
        # host root at /hostfs (read-only), so no extra volume is needed.
        filelog/audit:
          include:
            - /hostfs/var/log/audit/kube/*.log
          start_at: end
          retry_on_failure:
            enabled: true
      processors:
        # Every other pipeline in this file has one; the daemon metrics pipeline
        # was the only one without it, and it runs under a 320Mi limit.
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15
        # Kubelet volume metrics collapse into one series per pod, because the
        # volume name never reaches Mimir as a label. Mimir rejects the
        # conflicting samples, and the value it keeps is arbitrary. Drop them.
        filter/volume_inodes:
          error_mode: ignore
          metrics:
            metric:
              - 'name == "k8s.volume.inodes" or name == "k8s.volume.inodes.free" or name == "k8s.volume.inodes.used" or name == "k8s.volume.available" or name == "k8s.volume.capacity"'
        # Same label as the cluster collector, so daemon series join with the
        # cluster-scoped rules (e.g. CephNodeDiskspaceWarning on(cluster, instance)).
        transform/cluster_label:
          metric_statements:
            - context: datapoint
              statements:
                - set(attributes["cluster"], "home")
        resource/audit:
          attributes:
            - action: insert
              key: service.name
              value: kube-audit
      service:
        pipelines:
          traces:
            # Sampling happens tail-side in the gateway, not here.
            processors: [memory_limiter, batch]
            exporters: [otlp/gateway]
          metrics:
            # Presets' processors listed explicitly so the volume filter runs
            # first; keep this list in sync with the enabled presets.
            processors: [memory_limiter, filter/volume_inodes, transform/cluster_label, k8s_attributes, resource_detection/env, resource/hostname, batch]
            exporters: [otlp/gateway]
          logs:
            processors: [memory_limiter, batch]
            exporters: [otlp/gateway]
          logs/audit:
            receivers: [filelog/audit]
            processors: [resource/audit, resource_detection/env, resource/hostname, batch]
            exporters: [otlp/gateway]
    presets:
      # host_metrics (system_*) and kubelet_stats (k8s_*) duplicate node-exporter
      # and cAdvisor. No dashboard or rule in this repo reads their families.
      hostMetrics:
        enabled: false
      kubeletMetrics:
        enabled: false
      prometheus:
        nodeExporter:
          enabled: true
        cadvisor:
          enabled: true
        podAnnotations:
          enabled: true
      # kubernetesEvents and clusterMetrics must run on a single replica, so
      # they live on the cluster collector. On every daemon pod they duplicated
      # events and cluster-level series.
      kubernetesEvents:
        enabled: false
      clusterMetrics:
        enabled: false

  # Single-replica tail-sampling gateway: every app/proxy head-samples at
  # 100% (see the Instrumentation CR above and each app's own tracing
  # config), and this is the one place that actually decides what reaches
  # Tempo - keep anything that errored or was slow, plus a random baseline
  # of the rest. One replica is enough at homelab trace volume and keeps
  # this simple (every trace's spans naturally land on the same instance,
  # no need for a loadbalancing/consistent-hashing exporter in front of it -
  # revisit if this ever needs to scale beyond one replica).
  gateway:
    enabled: true
    suffix: gateway
    replicas: 1
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8888"
    # Now the single path to storage for every signal from every collector, so it
    # is sized for the combined load. Re-check against its self-telemetry after rollout.
    env:
      - name: PHOENIX_ADMIN_SECRET
        valueFrom:
          secretKeyRef:
            name: phoenix-secret
            key: PHOENIX_ADMIN_SECRET
    # The gateway now receives every signal and peaks above 1.2 GiB. At the old 1536Mi limit it was
    # OOMKilled, and the memory limiter drops data at 75% of the limit. Size it for the observed peak.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2560Mi
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              # Default is 4 MiB. The cluster collector's kube-state-metrics batches are larger,
              # so the gateway rejected them with ResourceExhausted and they were dropped.
              max_recv_msg_size_mib: 64
              keepalive:
                enforcement_policy:
                  min_time: 10s
                  permit_without_stream: true
            http:
              endpoint: 0.0.0.0:4318
              max_request_body_size: 67108864
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15
        # Fan-out for AI/LLM spans, taken before tail sampling so every AI span
        # reaches Phoenix, not just the sampled ones.
        filter/ai:
          error_mode: ignore
          traces:
            span:
              - 'attributes["openinference.span.kind"] == nil and attributes["gen_ai.operation.name"] == nil and attributes["gen_ai.system"] == nil and attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.request.model"] == nil'
        tail_sampling:
          # How long to buffer a trace's spans before deciding - long enough
          # for most homelab request chains to finish.
          decision_wait: 10s
          policies:
            - name: errors
              type: status_code
              status_code:
                status_codes: [ERROR]
            - name: slow
              type: latency
              latency:
                threshold_ms: 500
            - name: baseline
              type: probabilistic
              probabilistic:
                sampling_percentage: 10
        batch:
          send_batch_size: 1000
          timeout: 1s
      exporters:
        # Phoenix is only reachable from the gateway, which is the only collector
        # that mounts PHOENIX_ADMIN_SECRET. AI/LLM traces only, fanned out in traces/phoenix.
        otlp_http/phoenix:
          endpoint: http://phoenix-svc.observability.svc.cluster.local:6006
          headers:
            authorization: Bearer ${env:PHOENIX_ADMIN_SECRET}
          tls:
            insecure: true
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, tail_sampling, batch]
            exporters: [otlp/tempo]
          # Fan-out from the same OTLP receiver: Phoenix sees every AI span before sampling.
          traces/phoenix:
            receivers: [otlp]
            processors: [filter/ai, batch]
            exporters: [otlp_http/phoenix]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http/mimir]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http/loki]

  # Only collector reachable from outside the cluster: terminates OTLP/HTTP
  # from remote clusters/services behind otlp.darkflame.dev (httproute.yaml,
  # Cloudflare tunnel -> envoy-external). Requires a bearer token, then
  # fans out to the same backends as in-cluster telemetry; traces go via the
  # gateway collector so tail sampling still applies. Nothing else in the
  # stack is exposed. HTTP only - CF tunnel gRPC needs extra setup.
  ingress:
    enabled: true
    suffix: ingress
    replicas: 2
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    env:
      - name: OTLP_INGEST_TOKEN
        valueFrom:
          secretKeyRef:
            name: otlp-ingest-tokens
            key: token
    podAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      extensions:
        bearertokenauth:
          token: ${env:OTLP_INGEST_TOKEN}
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
              max_request_body_size: 10485760
              auth:
                authenticator: bearertokenauth
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15
        # Remote senders should set k8s.cluster.name themselves; this only
        # guarantees the attribute exists so remote data is never mistaken
        # for the home cluster.
        resource/remote:
          attributes:
            - action: insert
              key: k8s.cluster.name
              value: remote-unknown
        batch:
          send_batch_size: 1000
          timeout: 1s
      service:
        extensions: [bearertokenauth]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource/remote, batch]
            exporters: [otlp/gateway]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, resource/remote, batch]
            exporters: [otlp/gateway]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, resource/remote, batch]
            exporters: [otlp/gateway]
