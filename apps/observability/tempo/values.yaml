# No yaml-language-server schema available: grafana-community/tempo

# observability is an ambient-mesh namespace. The gateway collector was
# already excluded from ambient (see opentelemetry-kube-stack's Kyverno
# policy) to fix a plain-OTLP/HTTP reset bug - but that made it a
# non-member calling INTO Tempo (still a member), and that mismatch alone
# (independent of, and on top of, the grpc keepalive fix below) still broke
# the connection with "connection reset by peer". Keeping every hop of this
# self-contained telemetry pipeline off the mesh avoids this whole class of
# ztunnel/HBONE mismatch - none of this traffic needs mTLS from Istio, it's
# all plaintext OTLP already.
podLabels:
  istio.io/dataplane-mode: none
# Tempo's own metrics (distributor, ingester, compactor) on the HTTP port. The daemon collector
# discovers annotated pods, so these are scraped into Mimir.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3200"
  prometheus.io/path: /metrics

tempo:
  reportingEnabled: false

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir-gateway.observability.svc.cluster.local/api/v1/push"

  storage:
    trace:
      backend: s3
      s3:
        bucket: ${BUCKET_NAME}
        endpoint: ${BUCKET_HOST}:${BUCKET_PORT}
        access_key: ${AWS_ACCESS_KEY_ID}
        secret_key: ${AWS_SECRET_ACCESS_KEY}
        insecure: true

  liveStore:
    max_block_duration: 30m
    max_block_bytes: 104857600

  receivers:
    otlp:
      protocols:
        grpc:
          keepalive:
            enforcement_policy:
              min_time: 10s
              permit_without_stream: true

  extraArgs:
    config.expand-env: "true"

  extraEnvFrom:
    - secretRef:
        name: tempo-bucket
    - configMapRef:
        name: tempo-bucket

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 2048Mi

persistence:
  enabled: true

# Pod security: RuntimeDefault seccomp at pod level, and no ServiceAccount token. Tempo writes to
# Mimir and object storage over HTTP and never calls the Kubernetes API.
securityContext:
  seccompProfile:
    type: RuntimeDefault
serviceAccount:
  automountServiceAccountToken: false
