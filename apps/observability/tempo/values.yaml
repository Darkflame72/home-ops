# No yaml-language-server schema available: grafana-community/tempo
fullnameOverride: tempo

# observability is an ambient-mesh namespace. The gateway collector was
# already excluded from ambient (see opentelemetry-kube-stack's Kyverno
# policy) to fix a plain-OTLP/HTTP reset bug - but that made it a
# non-member calling INTO Tempo (still a member), and that mismatch alone
# (independent of, and on top of, the grpc keepalive fix below) still broke
# the connection with "connection reset by peer". Keeping every hop of this
# self-contained telemetry pipeline off the mesh avoids this whole class of
# ztunnel/HBONE mismatch - none of this traffic needs mTLS from Istio, it's
# all plaintext OTLP already.
podLabels:
  istio.io/dataplane-mode: none

tempo:
  reportingEnabled: false
  multitenancyEnabled: false

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir-gateway.observability.svc.cluster.local/api/v1/push"

  storage:
    trace:
      backend: s3
      s3:
        bucket: ${BUCKET_NAME}
        endpoint: ${BUCKET_HOST}:${BUCKET_PORT}
        access_key: ${AWS_ACCESS_KEY_ID}
        secret_key: ${AWS_SECRET_ACCESS_KEY}
        insecure: true
      wal:
        path: /var/tempo/wal

  # OTLP receivers are enabled by default in this chart (grpc: 4317, http: 4318)
  # Jaeger protocols disabled — only use OTLP
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
          keepalive:
            enforcement_policy:
              min_time: 10s
              permit_without_stream: true
        http:
          endpoint: "0.0.0.0:4318"

  extraArgs:
    config.expand-env: "true"

  extraEnvFrom:
    - secretRef:
        name: tempo-bucket
    - configMapRef:
        name: tempo-bucket

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 1024Mi

persistence:
  enabled: true
  size: 10Gi
  storageClass: ceph-block

metaMonitoring:
  dashboards:
    enabled: true
