      Unlike every other namespace's default-allow, this one lists
      "observability" directly instead of needing a port-blanket exception
      for metrics scraping — observability is already enrolled by the time
      renovate is, so real mesh-identity matching works here. No CNPG
      cluster in renovate, so no allow-cnpg policy needed either.
