    synchronize:
      enabled: false
  variables:
    - name: downstream
      expression: >-
        [
          {
            "apiVersion": dyn("security.istio.io/v1"),
            "kind": dyn("AuthorizationPolicy"),
            "metadata": dyn({
              "name": "default-allow",
              "namespace": "renovate"
            }),
            "spec": dyn({
              "rules": [
                {
                  "from": [
                    {"source": {"namespaces": ["renovate", "network", "observability"]}}
                  ]
                }
              ]
            })
          }
        ]
  generate:
    - expression: "generator.Apply('renovate', variables.downstream)"
