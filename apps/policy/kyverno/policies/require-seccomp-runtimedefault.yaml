---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-seccomp-runtimedefault
  annotations:
    policies.kyverno.io/title: Require seccomp RuntimeDefault
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      | variables.allContainers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault','Localhost'])|Pods must use the RuntimeDefault seccomp profile, either at pod level or on every container. Audit only: violations are reported in Policy Reporter and nothing is blocked.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        (object.spec.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault','Localhost'])
      message: >-
        seccompProfile.type RuntimeDefault or Localhost at pod or on every container.
