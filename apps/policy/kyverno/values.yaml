# No yaml-language-server schema available: kyverno/kyverno (no values.schema.json)
features:
  policyExceptions:
    enabled: true
    # Restrict to the policy namespace so exceptions stay reviewable in one
    # place rather than any namespace being able to opt itself out of rules.
    namespace: policy
  backgroundScan:
    # Default of 2 workers churning through 22 image-signature policies plus
    # the rest of the ruleset across every resource in the cluster caused
    # intermittent "policy not evaluated" false-fail results (confirmed
    # 2026-07-20: policies whose matchImageReferences didn't even match the
    # resource's image, e.g. verify-image-signatures-dex against
    # kopia-primary-kopia-ui, which only runs a kopiur-mover image) —
    # background scan contention, not a real signature failure.
    #
    # Bumped to 6 workers then caused a *different* problem (confirmed
    # 2026-08-10): concurrent workers racing to write .status on the same
    # ImageValidatingPolicy objects (verify-image-signatures-argocd,
    # verify-image-signatures-maddy) hit constant 409 conflicts and retried
    # in a tight loop — reports-controller pegged at 1.6-2.4 CPU cores and
    # crash-looping every 30-90min. Dropped to 3 as a middle ground; may
    # need further tuning in either direction.
    backgroundScanWorkers: 3

reportsServer:
  enabled: false

grafana:
  enabled: true

admissionController:
  serviceMonitor:
    enabled: true
  rbac:
    clusterRole:
      extraResources:
        - apiGroups:
            - postgresql.cnpg.io
          resources:
            - scheduledbackups
          verbs:
            - create
            - delete
            - get
            - list
            - patch
            - update
            - watch
        - apiGroups:
            - postgresql.cnpg.io
          resources:
            - clusters
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - grafana.integreatly.org
          resources:
            - grafanadashboards
          verbs:
            - create
            - delete
            - get
            - list
            - patch
            - update
            - watch
        - apiGroups:
            - security.istio.io
          resources:
            - authorizationpolicies
          verbs:
            - create
            - delete
            - get
            - list
            - patch
            - update
            - watch
        - apiGroups:
            - ""
          resources:
            - namespaces
          verbs:
            - get
            - list
            - patch
            - update
            - watch

backgroundController:
  serviceMonitor:
    enabled: true
  resources:
