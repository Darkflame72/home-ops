cleanupController:
  serviceMonitor:
    enabled: true

reportsController:
  serviceMonitor:
    enabled: true
  resources:
    # Chart default (128Mi limit) OOMKilled once after adding 4 more active
    # CEL background-scan policies (2026-07-19); bumped to 512Mi. Now
    # OOMKilling again (6 restarts/13h, observed exitCode 137) with ~22
    # verify-image-signatures-* ImageValidatingPolicies added since —
    # each background-scan cycle does cosign/Rekor verification per image
    # per policy across every pod in the cluster. Crashes mid-cycle leave
    # stale/incomplete PolicyReport results until the next full rescan.
    limits:
      # CPU limit added deliberately, as a circuit breaker (2026-08-10) -
      # this controller has a history of resource runaways (prior OOMs at
      # 128Mi/512Mi, now a status-write conflict-retry storm burning 1.6-2.4
      # cores unbounded with no cap). Repo convention elsewhere is to skip
      # CPU limits (see require-requests-limits.yaml, which doesn't require
      # one) to avoid CFS throttling, but this controller's track record
      # justifies the exception.
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 150m
      memory: 256Mi
