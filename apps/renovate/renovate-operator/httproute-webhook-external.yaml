---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Exposes ONLY the webhook receiver publicly (for GitHub deliveries). The UI at
# renovate.darkflame.dev stays internal-only via the chart's envoy-internal route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate-webhook-external
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - renovate.darkflame.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: renovate-operator-renovate-operator
          port: 8081
      matches:
        - path:
            type: PathPrefix
            value: /webhook
