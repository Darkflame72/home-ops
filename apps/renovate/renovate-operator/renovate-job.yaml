# yaml-language-server: $schema=../../../.github/schemas/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  schedule: "0 3 * * *"
  # renovate: datasource=docker depName=renovate/renovate
  image: renovate/renovate:44.257.8@sha256:68f58fa3b0e92875fa2f44c4ae02936186818b0170c2d39fe7261a2af5260f36
  secretRef: renovate-secret
  parallelism: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  provider:
    name: forgejo
    endpoint: "https://git.darkflame.dev/api/v1"
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-secret
        key: token
    # Automatically create/remove the webhook on every discovered Forgejo repo
    # each discovery cycle. Uses RENOVATE_TOKEN from spec.secretRef, so the bot
    # account needs admin (not just push) permission on the repos.
    sync:
      enabled: true
