---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Client secrets for Authentik-managed OAuth2 providers, referenced by blueprints via
# !Env. Sourced from the same Infisical paths each app's own ExternalSecret already
# reads, so these are never a second source of truth for the secret value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authentik-blueprint-secrets
  data:
  - secretKey: BAR_ASSISTANT_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /bar-assistant/oauth2-client-secret
  - secretKey: FORGEJO_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /forgejo/oauth2-client-secret
  - secretKey: GOTOSOCIAL_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /gotosocial/oauth2-client-secret
  - secretKey: GRAFANA_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /grafana/client_secret
  - secretKey: HARBOR_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /harbor/oidc-client-secret
  - secretKey: MINIFLUX_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /miniflux/oauth2-client-secret
  - secretKey: RENOVATE_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /renovate/oauth2-client-secret
  - secretKey: NEXTCLOUD_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /nextcloud/oauth2-client-secret
  - secretKey: JELLYFIN_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /jellyfin/oauth2-client-secret
  - secretKey: IMMICH_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /immich/oauth2-client-secret
  - secretKey: KIALI_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /kiali/client_secret
  - secretKey: MAILCOW_CLIENT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: /mailcow/oauth2-client-secret
