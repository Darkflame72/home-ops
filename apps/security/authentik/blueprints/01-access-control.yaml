version: 1
metadata:
  name: access-control
entries:
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      pk: 0fbbd1f1-287a-4e61-972a-47c832ad2830
      name: require-mfa-privileged-groups
    attrs:
      expression: |
        privileged_groups = {"authentik Admins", "harbor-admins", "gitadmin", "jellyfin-admin"}
        user_groups = {g.name for g in request.user.ak_groups.all()}
        return bool(privileged_groups & user_groups)

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      pk: 24952e22-64dd-419f-bf75-e4ee10b8d8f7
      name: admin-mfa-enforce-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - static
        - totp
        - webauthn
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_static.authenticatorstaticstage, [name, default-authenticator-static-setup]]
      last_auth_threshold: seconds=0
      webauthn_user_verification: preferred

  # Extends the built-in default-authentication-flow (not redefined here, only
  # referenced by slug) with a stage that forces MFA enrollment for privileged
  # groups. Non-privileged users fall through unaffected to the flow's original
  # always-skip MFA validation stage at order=30.
  - model: authentik_flows.flowstagebinding
    identifiers:
      pk: 6a376f26-c37f-49cb-a573-de0f00b488ab
    attrs:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, admin-mfa-enforce-validation]]
      order: 25
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  - model: authentik_policies.policybinding
    identifiers:
      pk: 5e2be6b8-5a08-4fcf-a194-424046c45f08
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [pk, 6a376f26-c37f-49cb-a573-de0f00b488ab]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-mfa-privileged-groups]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
