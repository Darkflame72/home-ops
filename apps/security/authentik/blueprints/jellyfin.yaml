version: 1
metadata:
  name: jellyfin-removal
entries:
  # Authentik does not delete objects when their blueprint entries are removed,
  # so these absent entries delete the Jellyfin SSO objects. Idempotent: once
  # applied they are no-ops and this file can be deleted from the kustomization.
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      pk: 64100d42-99e2-4932-a5dc-b078c94b88d9

  - model: authentik_core.application
    state: absent
    identifiers:
      pk: a85cbe00-6208-4a8d-92f0-1491ad2b360d
      slug: jellyfin

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      pk: 10
      name: "Provider for Jellyfin"

  - model: authentik_core.group
    state: absent
    identifiers:
      name: jellyfin-admin

  - model: authentik_core.group
    state: absent
    identifiers:
      name: jellyfin-user
