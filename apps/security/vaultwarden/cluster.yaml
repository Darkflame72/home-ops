---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-postgres
  namespace: security
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised

  # security is enrolled in the Istio ambient mesh (with an L7 waypoint), which
  # intercepts and breaks CNPG's own TLS + streaming-replication protocol on
  # 5432 (see apps/default/nextcloud/cluster.yaml for the incident). Opt out
  # of ambient capture.
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: none

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 128MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  resources:
    requests:
      memory: "256Mi"
      cpu: "75m"
    limits:
      memory: "4Gi"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: vaultwarden-postgres
