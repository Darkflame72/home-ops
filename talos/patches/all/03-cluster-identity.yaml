machine:
  certSANs:
    - 127.0.0.1
    - 10.0.60.10
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - 10.42.0.0/16
serviceSubnets:
  - 10.43.0.0/16
---
# Cilium replaces the built-in CNI; Talos 1.14 no longer suppresses the default
# KubeFlannelCNIConfig just because no CNI is configured, so it must be deleted explicitly.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Existing clusters keep non-isolated behavior by default on upgrade; stay on that explicitly
# rather than silently picking up topf's new-cluster default of workloadIsolation: true.
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
