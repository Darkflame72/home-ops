[project]
site_name = "Home Ops"
site_description = "How my homelab Kubernetes cluster is built and operated"
repo_url = "https://github.com/Darkflame72/home-ops"
repo_name = "Darkflame72/home-ops"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Setup Guide" = "setup.md" },
    { "Architecture" = "architecture.md" },
  ] },
  { "Infrastructure" = [
    { "Cluster Overview" = "cluster.md" },
    { "Hardware" = "hardware.md" },
    { "Networking" = "networking.md" },
    { "Storage" = "storage.md" },
  ] },
  { "Services" = [
    { "Databases" = "databases.md" },
    { "Backups" = "backups.md" },
    { "Secrets Management" = "secrets.md" },
    { "Security" = "security.md" },
    { "Observability" = "observability.md" },
  ] },
  { "Delivery" = [
    { "CI Checks" = "ci.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
